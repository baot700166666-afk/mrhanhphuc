<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MR HẠNH PHÚC — Catalogue váy cưới</title>
<meta name="description" content="Ứng dụng nội bộ tra cứu & giới thiệu váy cưới cho khách.">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#141110">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MR HẠNH PHÚC">
<link rel="apple-touch-icon" href="./icon/icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23141110'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='30' fill='%23B4603C' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F1EB; --bg-2:#EFE8DF; --card:#FFFFFF;
  --ink:#181513; --muted:#7A7169; --line:rgba(24,21,19,.13);
  --accent:#9C3B3B; --accent-soft:#F1DFDB;
  --shadow:0 20px 50px -22px rgba(24,21,19,.3);
  --r:14px; --r-lg:22px; --head-h:132px;
  --ease:cubic-bezier(.22,1,.36,1);
}
[data-theme="dark"]{
  --bg:#0D0C0B; --bg-2:#16130F; --card:#141210;
  --ink:#F4F0E9; --muted:#9C9288; --line:rgba(244,240,233,.15);
  --accent:#D97A6C; --accent-soft:#2A1D1B;
  --shadow:0 20px 50px -22px rgba(0,0,0,.75);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  transition:background .4s var(--ease),color .4s var(--ease)}
body.lock{overflow:hidden}
img{display:block;max-width:100%}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.serif{font-family:"Instrument Serif",Georgia,serif;font-weight:400}
.wrap{width:min(1500px,94vw);margin-inline:auto}
.up{letter-spacing:.16em;text-transform:uppercase}

/* ============ HEADER ============ */
.top{position:sticky;top:0;z-index:500;background:color-mix(in srgb,var(--bg) 93%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 0 0}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-family:"Instrument Serif",serif;font-weight:400;font-size:clamp(19px,4.6vw,25px);letter-spacing:.06em}
.brand i{width:5px;height:5px;border-radius:50%;background:var(--accent);display:block}
.tools{position:absolute;top:12px;right:max(12px,3vw);display:flex;gap:6px;align-items:center}
.tools-l{position:absolute;top:12px;left:max(12px,3vw);display:flex;gap:6px;align-items:center}
.ic{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;
  transition:.28s var(--ease);position:relative;flex:none;background:var(--bg)}
.ic:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ic svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ic.on{background:var(--accent);border-color:var(--accent);color:#fff}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;
  background:var(--accent);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;
  transform:scale(0);transition:transform .3s var(--ease)}
.badge.on{transform:scale(1)}

/* tabs */
.tabs{display:flex;gap:0;overflow-x:auto;max-width:100%;padding:2px max(12px,3vw) 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 15px 14px;font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);
  white-space:nowrap;position:relative;transition:color .25s;font-weight:400}
.tab::after{content:"";position:absolute;left:15px;right:15px;bottom:0;height:2px;background:var(--accent);
  transform:scaleX(0);transition:transform .3s var(--ease)}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);font-weight:500}
.tab.on::after{transform:scaleX(1)}

/* search */
.search{width:min(560px,90vw);margin:0 auto 14px;position:relative;display:none}
.search.open{display:block}
.search input{width:100%;padding:12px 42px 12px 42px;border:1px solid var(--line);border-radius:100px;
  background:var(--card);font-size:14.5px;transition:border-color .25s}
.search input:focus{outline:none;border-color:var(--accent)}
.search .mag{position:absolute;left:15px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted)}
.search .mag svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7}
.search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;
  border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.search .clr svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

/* ============ ALBUM GRID ============ */
main{padding:clamp(22px,4vw,44px) 0 90px;min-height:70vh}
.count-line{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  margin:0 0 clamp(16px,3vw,26px);text-align:center}
.albums{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:clamp(20px,3vw,40px) clamp(14px,2vw,26px)}
@media (max-width:760px){.albums{grid-template-columns:repeat(2,1fr);gap:20px 10px}}
@media (max-width:330px){.albums{grid-template-columns:1fr}}
@media (max-width:760px){
  .alb-meta{padding-top:10px}
  .alb-meta h3{font-size:11px;letter-spacing:.1em}
  .alb-meta .price{font-size:12px}
  .alb-meta .note{font-size:11px}
  .heart{width:32px;height:32px}
  .brand b{letter-spacing:.04em}
}
.alb{cursor:pointer;opacity:0;transform:translateY(22px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.alb.in{opacity:1;transform:none}
.alb-img{position:relative;aspect-ratio:3/4;overflow:hidden;border-radius:var(--r);background:var(--bg-2)}
.alb-img img{width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease),filter .5s;filter:blur(12px)}
.alb-img img.ready{filter:none}
.alb:hover .alb-img img{transform:scale(1.05)}
.alb-n{position:absolute;left:10px;bottom:10px;padding:5px 10px;border-radius:100px;
  background:rgba(0,0,0,.45);backdrop-filter:blur(8px);color:#fff;font-size:10.5px;letter-spacing:.1em;
  display:flex;align-items:center;gap:5px}
.alb-n svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8}
.heart{position:absolute;top:9px;right:9px;width:36px;height:36px;border-radius:50%;z-index:2;
  background:rgba(255,255,255,.16);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.3);display:grid;place-items:center;color:#fff;transition:.3s var(--ease)}
.heart svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.heart:active{transform:scale(.86)}
.heart.on{background:var(--accent);border-color:var(--accent)}
.heart.on svg{fill:#fff}
.alb-meta{text-align:center;padding:13px 6px 0}
.alb-meta h3{margin:0;font-size:12.5px;letter-spacing:.15em;text-transform:uppercase;font-weight:500;line-height:1.5}
.alb-meta .price{display:block;margin-top:5px;font-size:12.5px;color:var(--accent);font-weight:500}
.alb-meta .note{display:block;margin-top:3px;font-size:12px;color:var(--muted)}
body.guest .price,body.guest .note{display:none}

/* empty */
.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.empty svg{width:44px;height:44px;stroke:var(--line);fill:none;stroke-width:1.2;margin-bottom:14px}

/* ============ ALBUM VIEW ============ */
.cover{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:clamp(20px,4vw,60px);
  min-height:min(78vh,760px);padding:clamp(20px,4vw,40px) 0}
.cover-side{justify-self:end}
.cover-img{width:min(430px,72vw);aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;
  background:var(--bg-2);box-shadow:var(--shadow)}
.cover-img img{width:100%;height:100%;object-fit:cover}
.cover-txt h1{font-family:"Instrument Serif",serif;font-weight:400;font-size:clamp(32px,5.2vw,58px);
  margin:0;line-height:1.1;letter-spacing:.01em}
.cover-rule{width:52px;height:1px;background:var(--accent);margin:18px 0}
.cover-txt .d{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cover-txt .p{font-size:19px;color:var(--accent);margin:14px 0 0;font-weight:500}
.cover-txt .nt{color:var(--muted);font-size:14px;margin:8px 0 0;max-width:34ch}
.cover-acts{display:flex;gap:9px;flex-wrap:wrap;margin-top:26px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:100px;
  background:var(--ink);color:var(--bg);font-size:12.5px;letter-spacing:.06em;
  border:1px solid var(--ink);transition:.3s var(--ease);white-space:nowrap}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:900px){
  .cover{grid-template-columns:1fr;min-height:auto;text-align:center;gap:24px}
  .cover-side{justify-self:center}
  .cover-rule{margin:16px auto}
  .cover-txt .nt{margin-inline:auto}
  .cover-acts{justify-content:center}
}
.back{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--muted);padding:10px 0;transition:color .25s}
.back:hover{color:var(--ink)}
.back svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,1.4vw,20px);padding-bottom:30px}
@media (max-width:820px){.shots{grid-template-columns:repeat(2,1fr);gap:8px}}
.shot{aspect-ratio:3/4;overflow:hidden;border-radius:var(--r);background:var(--bg-2);cursor:pointer;
  opacity:0;transform:translateY(20px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.shot.in{opacity:1;transform:none}
.shot img{width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease),filter .5s;filter:blur(12px)}
.shot img.ready{filter:none}
.shot:hover img{transform:scale(1.05)}

/* ============ LIGHTBOX ============ */
#lb{position:fixed;inset:0;z-index:800;background:color-mix(in srgb,var(--bg) 97%,transparent);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  opacity:0;visibility:hidden;transition:opacity .35s var(--ease),visibility .35s;display:flex;flex-direction:column}
#lb.open{opacity:1;visibility:visible}
.lb-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(12px,3vw);flex:none}
.lb-info h4{margin:0;font-size:12px;letter-spacing:.15em;text-transform:uppercase;font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-info small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.lb-tools{display:flex;gap:6px}
.lb-stage{flex:1;position:relative;overflow:hidden;touch-action:none;min-height:0}
.lb-track{position:absolute;inset:0;display:flex;will-change:transform}
.lb-item{flex:0 0 100%;height:100%;display:grid;place-items:center;padding:clamp(6px,2vw,26px)}
.lb-item img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;box-shadow:var(--shadow);
  will-change:transform;-webkit-user-drag:none;user-select:none;cursor:zoom-in}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:4;width:48px;height:48px;border-radius:50%;
  background:color-mix(in srgb,var(--bg) 72%,transparent);border:1px solid var(--line);
  backdrop-filter:blur(10px);display:grid;place-items:center;transition:.3s var(--ease)}
.lb-nav:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lb-nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.lb-prev{left:max(8px,2vw)}.lb-next{right:max(8px,2vw)}
@media (max-width:760px){.lb-nav{display:none}.lb-tools .ic{width:34px;height:34px}}
.lb-bot{flex:none;padding:8px max(12px,3vw) max(12px,env(safe-area-inset-bottom))}
.lb-thumbs{display:flex;gap:6px;overflow-x:auto;padding:5px 2px;scrollbar-width:none}
.lb-thumbs::-webkit-scrollbar{display:none}
.lb-thumbs img{width:50px;height:66px;object-fit:cover;border-radius:6px;flex:none;opacity:.38;
  cursor:pointer;transition:.3s var(--ease);border:2px solid transparent}
.lb-thumbs img.on{opacity:1;border-color:var(--accent)}
.lb-play::after{content:"";position:absolute;inset:-1px;border-radius:50%;
  background:conic-gradient(var(--accent) var(--p,0deg),transparent 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 2px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 2px));
  opacity:0;transition:opacity .3s;pointer-events:none}
.lb-play.on::after{opacity:1}
.lb-play svg:last-child{display:none}
.lb-play.on svg:first-child{display:none}
.lb-play.on svg:last-child{display:block}

/* ============ DRAWER ============ */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,100vw);z-index:700;background:var(--bg);
  border-left:1px solid var(--line);transform:translateX(101%);transition:transform .5s var(--ease);
  display:flex;flex-direction:column;box-shadow:var(--shadow)}
#drawer.open{transform:none}
#scrim{position:fixed;inset:0;z-index:690;background:rgba(0,0,0,.42);opacity:0;visibility:hidden;transition:.35s}
#scrim.open{opacity:1;visibility:visible}
.dr-top{display:flex;align-items:center;justify-content:space-between;padding:18px max(16px,4vw);
  border-bottom:1px solid var(--line);flex:none}
.dr-top h3{margin:0;font-size:12.5px;letter-spacing:.15em;text-transform:uppercase;font-weight:500}
.dr-body{flex:1;overflow-y:auto;padding:12px max(16px,4vw)}
.dr-row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.dr-row img{width:52px;height:68px;object-fit:cover;border-radius:8px;flex:none;background:var(--bg-2)}
.dr-row div{flex:1;min-width:0}
.dr-row b{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:500}
.dr-row small{color:var(--accent);font-size:12.5px}
.dr-row button{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.dr-row button:hover{background:var(--bg-2);color:var(--ink)}
.dr-row button svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.dr-foot{flex:none;padding:14px max(16px,4vw) max(18px,env(safe-area-inset-bottom));
  border-top:1px solid var(--line);display:flex;gap:8px}
.dr-foot .btn{flex:1;justify-content:center}

/* ============ misc ============ */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,220%);opacity:0;visibility:hidden;z-index:900;
  background:var(--ink);color:var(--bg);padding:12px 21px;border-radius:100px;font-size:13.5px;
  display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);max-width:90vw;
  transition:transform .45s var(--ease),opacity .3s,visibility .3s}
#toast.on{transform:translate(-50%,0);opacity:1;visibility:visible}
#drawer.open ~ #toast{bottom:96px}
#toast svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.guest-bar{position:fixed;left:50%;transform:translate(-50%,150%);bottom:18px;z-index:600;
  background:var(--accent);color:#fff;padding:9px 16px;border-radius:100px;font-size:12px;letter-spacing:.08em;
  display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);transition:transform .45s var(--ease)}
body.guest .guest-bar{transform:translate(-50%,0)}
.guest-bar button{color:#fff;text-decoration:underline;font-size:12px}
footer{border-top:1px solid var(--line);padding:22px 0 30px;text-align:center;font-size:11.5px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* ===== bộ sưu tập ===== */
.bo-head{text-align:center;padding:clamp(10px,3vw,26px) 0 clamp(22px,4vw,40px)}
.bo-head h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;
  font-size:clamp(34px,6vw,64px);margin:0;line-height:1.08}
.bo-head p{margin:10px 0 0;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.eyebrow-line{width:44px;height:1px;background:var(--accent);margin:0 auto 18px}
.crumb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0 6px;
  font-size:11.5px;letter-spacing:.1em;text-transform:uppercase}
.crumb a{display:inline-flex;align-items:center;gap:7px;color:var(--muted);transition:color .25s;
  padding:5px 0}
.crumb a:hover{color:var(--accent)}
.crumb svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.crumb span{color:var(--line);font-size:14px}
.crumb b{font-weight:500;color:var(--ink)}
@media (max-width:600px){.crumb{font-size:10.5px;gap:6px}}
.alb-dm{position:absolute;left:10px;top:10px;padding:4px 9px;border-radius:100px;
  background:rgba(0,0,0,.42);backdrop-filter:blur(8px);color:#fff;font-size:9.5px;
  letter-spacing:.1em;text-transform:uppercase}
.ad-tag.dm{border-color:var(--accent);color:var(--accent)}
.shots figcaption{text-align:center;padding-top:8px;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted)}
.shot{overflow:visible}
.shot img{border-radius:var(--r)}
.shots{align-items:start}
#boot{position:fixed;inset:0;z-index:999;background:var(--bg);display:grid;place-items:center;
  transition:opacity .45s,visibility .45s}
#boot.done{opacity:0;visibility:hidden}
#boot div{text-align:center}
#boot b{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:clamp(24px,6vw,38px);
  letter-spacing:.08em;display:block}
#boot small{display:block;margin-top:12px;font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--muted)}

/* ===== quản trị ===== */
body.admin-mode .tabs,body.admin-mode #searchBox{display:none}
.ad-login{max-width:400px;margin:6vh auto;text-align:center}
.ad-login h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:clamp(30px,6vw,46px);margin:0}
.ad-login>p{color:var(--muted);font-size:14px;margin:10px 0 22px}
.ad-login form{display:flex;gap:8px}
.ad-login input{flex:1;padding:13px 16px;border:1px solid var(--line);border-radius:100px;
  background:var(--card);font-size:15px;text-align:center;letter-spacing:.1em}
.ad-login input:focus{outline:none;border-color:var(--accent)}
.ad-login input.err{border-color:#C0392B;animation:lac .3s}
@keyframes lac{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ad-warn{font-size:12px;color:var(--muted);background:var(--bg-2);border-radius:12px;
  padding:14px 16px;margin:22px 0;line-height:1.6;text-align:left}
.ad-warn b{color:var(--ink)}
.ad-bar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
  padding:6px 0 18px;border-bottom:1px solid var(--line);margin-bottom:18px}
.ad-bar>div:first-child b{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:26px}
.ad-bar>div:first-child span{font-size:12px;color:var(--muted);margin-left:10px}
.ad-acts{display:flex;gap:7px;flex-wrap:wrap}
.ad-acts .btn{padding:9px 15px;font-size:12px}
.ad-size{font-size:12.5px;color:var(--muted);background:var(--bg-2);padding:10px 14px;
  border-radius:10px;margin:0 0 16px}
.ad-size.nang{background:var(--accent-soft);color:var(--accent)}
.ad-row{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--card)}
.ad-row.mo{border-color:var(--accent)}
.ad-head{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;flex-wrap:wrap}
.ad-head:hover{background:var(--bg-2)}
.ad-i{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:22px}
.ad-head b{font-size:14px;font-weight:500;min-width:130px}
.ad-tag{font-size:11.5px;color:var(--muted);padding:3px 9px;border:1px solid var(--line);border-radius:100px}
.ad-tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ad-sort{display:flex;gap:3px;margin-left:auto}
.ad-sort button{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);
  display:grid;place-items:center;color:var(--muted);transition:.2s}
.ad-sort button:hover:not(:disabled){background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ad-sort button:disabled{opacity:.28;cursor:default}
.ad-sort svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ad-sua{display:flex;align-items:center;gap:4px;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent);padding:5px 10px;border:1px solid var(--accent);
  border-radius:100px;white-space:nowrap}
.ad-cx{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;
  transition:transform .3s var(--ease)}
.ad-row.mo .ad-cx{transform:rotate(180deg)}
.ad-row.mo .ad-sua{background:var(--accent);color:#fff}
@media (max-width:760px){
  .ad-head{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"i ten sua" ". tags sort";
    gap:6px 10px;padding:12px}
  .ad-i{grid-area:i} .ad-head b{grid-area:ten;min-width:0}
  .ad-tags{grid-area:tags} .ad-sort{grid-area:sort;margin:0} .ad-sua{grid-area:sua}
  .ad-tag{font-size:10.5px;padding:2px 7px}
  .ad-bar{flex-direction:column;align-items:stretch}
  .ad-acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .ad-acts .btn{justify-content:center}
  .ad-form{padding:4px 10px 14px}
}
.ad-form{padding:4px 14px 16px;border-top:1px solid var(--line)}
.ad-g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.ad-g3{display:grid;grid-template-columns:150px 1fr 1.4fr;gap:10px}
@media (max-width:700px){.ad-g2,.ad-g3{grid-template-columns:1fr}}
.ad-form label{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ad-form input:not([type=file]),.ad-form select{width:100%;margin-top:5px;padding:10px 12px;
  border:1px solid var(--line);border-radius:9px;background:var(--bg);font-size:13.5px}
.ad-form input:focus,.ad-form select:focus{outline:none;border-color:var(--accent)}
.ad-fs{border:1px solid var(--line);border-radius:10px;padding:12px 14px 14px;margin:0 0 12px}
.ad-fs legend{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);padding:0 6px}
.ad-anh{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.ad-th{position:relative;width:56px;height:75px;border-radius:7px;overflow:hidden;background:var(--bg-2)}
.ad-th img{width:100%;height:100%;object-fit:cover}
.ad-th button{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;
  background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:1;display:grid;place-items:center}
.ad-th span{position:absolute;bottom:2px;left:4px;font-size:9px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.ad-them{width:56px;height:75px;border:1px dashed var(--line);border-radius:7px;display:grid;
  place-items:center;cursor:pointer;transition:.25s}
.ad-them:hover{border-color:var(--accent);color:var(--accent)}
.ad-them span{font-size:10px;text-align:center;letter-spacing:0;text-transform:none;padding:4px}
.ad-hint{font-size:11.5px;color:var(--muted);margin:10px 0 0}
.ad-foot{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
.ad-foot .btn{padding:9px 18px;font-size:12.5px}

<script>
/* ══════════════════════════════════════════════════════════════
   BỘ VẼ VÁY — tạo ảnh ngay trên trình duyệt, không cần file ảnh
   Mỗi (mẫu váy, số thứ tự ảnh) cho ra một bố cục / góc máy khác nhau.
   Không dùng ctx.filter (blur) vì rất chậm — độ mềm tạo bằng gradient.
   ══════════════════════════════════════════════════════════════ */
const RW = 720, RH = 960;

function rng(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const lerp = (a,b,t)=>a+(b-a)*t;

/* dáng váy: waist = eo, hem = gấu, exp = độ cong, wy = vị trí eo */
const DANG_HINH = {
  xoe:    {waist:.052, hem:.46,  exp:.60, wy:.34},
  chuA:   {waist:.050, hem:.28,  exp:.95, wy:.32},
  duoica: {waist:.048, hem:.33,  exp:2.6, wy:.30},
  suong:  {waist:.052, hem:.115, exp:1.3, wy:.30},
  aodai:  {waist:.046, hem:.105, exp:1.1, wy:.30},
  vest:   {waist:.082, hem:.088, exp:1.0, wy:.34},
  canh:   {waist:.075, hem:.30,  exp:.85, wy:.32},   /* dùng cho album / phóng sự */
};

/* màu vải theo kiểu dáng */
const VAI = {
  xoe:    ['#DBD2C6','#F5F1EA','#FFFEFC','#E0D7CA'],
  chuA:   ['#DAD1C4','#F4F0E8','#FFFDFA','#DFD5C8'],
  duoica: ['#D8CFC2','#F3EEE6','#FFFDF9','#DDD3C5'],
  suong:  ['#DCD4C9','#F6F2EC','#FFFEFD','#E1D9CE'],
  aodai:  ['#8E2B24','#C4453A','#E0705F','#7A231D'],
  vest:   ['#23262B','#3C4149','#565D68','#1B1E22'],
  canh:   ['#D9D0C4','#F4EFE8','#FFFEFB','#DED5C8'],
};

/* bảng màu phông: [đỉnh, đáy, quầng sáng] */
const PHONG = [
  ['#EDE5DA','#C2B3A3','#FBF6EE'], ['#E6DCCF','#B0A395','#F6EFE5'],
  ['#F1E9DE','#CBB9A6','#FEFAF4'], ['#DFD9D1','#A9A096','#F4F0EA'],
  ['#F3EADC','#D0BCA4','#FFFBF5'], ['#E2D6C6','#B7A48F','#F9F2E8'],
  ['#E4E1DC','#ADA9A2','#F7F5F1'], ['#EFE3D3','#C3AB90','#FCF6EC'],
  ['#DDD4C8','#A79C8D','#F3ECE3'], ['#F0E6DE','#C7B2A6','#FDF7F2'],
];

/* 10 bố cục — mỗi ảnh một khung hình / góc máy khác nhau */
const BOCUC = [
  {ten:'Toàn thân',     cam:[0,0,1,1],              scale:1.00, dx:0,    sang:.55, beam:0},
  {ten:'Lệch trái',     cam:[0,0,1,1],              scale:0.92, dx:-.13, sang:.30, beam:0},
  {ten:'Nắng cửa sổ',   cam:[0,0,1,1],              scale:0.96, dx:.10,  sang:.72, beam:1},
  {ten:'Trung cảnh',    cam:[.133,.30,.733,.733],   scale:1.00, dx:0,    sang:.50, beam:0},
  {ten:'Cận thân trên', cam:[.291,.125,.418,.418],  scale:1.00, dx:0,    sang:.62, beam:0},
  {ten:'Chân váy',      cam:[.167,.583,.667,.667],  scale:1.00, dx:0,    sang:.42, beam:0},
  {ten:'Toàn cảnh',     cam:[0,0,1,1],              scale:0.78, dx:0,    sang:.38, beam:0},
  {ten:'Góc thấp',      cam:[.111,.392,.778,.778],  scale:1.06, dx:.04,  sang:.58, beam:0},
  {ten:'Cận nếp vải',   cam:[.367,.50,.30,.30],     scale:1.00, dx:0,    sang:.50, beam:0},
  {ten:'Ngược sáng',    cam:[0,0,1,1],              scale:0.98, dx:-.05, sang:.84, beam:2},
];

/* ô nhiễu tạo một lần rồi dùng lại */
let _nhieu = null;
function oNhieu(){
  if(_nhieu) return _nhieu;
  const n = document.createElement('canvas');
  n.width = n.height = 96;
  const nc = n.getContext('2d');
  const im = nc.createImageData(96,96), d = im.data;
  for(let i=0;i<d.length;i+=4){
    const v = 112 + Math.random()*32;
    d[i]=d[i+1]=d[i+2]=v; d[i+3]=255;
  }
  nc.putImageData(im,0,0);
  return (_nhieu = n);
}

/* đường viền thân váy */
function duongVay(ctx, dang, seed, cx, topY, botY, scale){
  const P = DANG_HINH[dang] || DANG_HINH.chuA;
  const N = 72, Lx = [], Rx = [], Y = [];
  for(let i=0;i<=N;i++){
    const t = i/N;
    let hw;
    if(t < P.wy){ const u = t/P.wy; hw = lerp(.098, P.waist, Math.pow(u,.75)); }
    else        { const u = (t-P.wy)/(1-P.wy); hw = lerp(P.waist, P.hem, Math.pow(u,P.exp)); }
    if(t > .55) hw *= 1 + .012*Math.sin(t*26 + seed);
    const w = hw*RW*scale;
    Lx.push(cx-w); Rx.push(cx+w); Y.push(lerp(topY, botY, t));
  }
  const nw = .098*RW*scale;
  ctx.beginPath();
  ctx.moveTo(Lx[0], Y[0]);
  for(let i=1;i<=N;i++) ctx.lineTo(Lx[i], Y[i]);
  ctx.lineTo(Rx[N], Y[N]);
  for(let i=N-1;i>=0;i--) ctx.lineTo(Rx[i], Y[i]);
  ctx.quadraticCurveTo(cx + nw*.52, topY + nw*.62, cx, topY + nw*.34);
  ctx.quadraticCurveTo(cx - nw*.52, topY + nw*.62, Lx[0], Y[0]);
  ctx.closePath();
  return {nw, hemW: Rx[N]-cx, waistY: lerp(topY, botY, P.wy)};
}

/* nếp vải mềm: quad dọc tô bằng gradient ngang trong suốt hai mép */
function nepVai(c, x0, y0, x1, y1, w0, w1, mau, dam){
  const g = c.createLinearGradient(x1 - w1, 0, x1 + w1, 0);
  g.addColorStop(0,   mau.replace('$', '0'));
  g.addColorStop(.5,  mau.replace('$', dam));
  g.addColorStop(1,   mau.replace('$', '0'));
  c.fillStyle = g;
  c.beginPath();
  c.moveTo(x0 - w0, y0); c.lineTo(x0 + w0, y0);
  c.lineTo(x1 + w1, y1); c.lineTo(x1 - w1, y1);
  c.closePath(); c.fill();
}

/* vẽ một tấm ảnh vào canvas đích */
function veAnh(canvas, dang, seed, sttAnh){
  const bc  = BOCUC[sttAnh % BOCUC.length];
  const rnd = rng(seed*977 + sttAnh*31 + 7);
  const pal = PHONG[(seed + sttAnh*3) % PHONG.length];

  const off = document.createElement('canvas');
  off.width = RW; off.height = RH;
  const c = off.getContext('2d');

  /* 1. phông nền */
  let g = c.createLinearGradient(0,0,0,RH);
  g.addColorStop(0, pal[0]); g.addColorStop(1, pal[1]);
  c.fillStyle = g; c.fillRect(0,0,RW,RH);

  const gx = RW*bc.sang, gy = RH*.22;
  g = c.createRadialGradient(gx, gy, 0, gx, gy, RH*.80);
  g.addColorStop(0, pal[2]); g.addColorStop(1, 'rgba(255,255,255,0)');
  c.globalAlpha = .85; c.fillStyle = g; c.fillRect(0,0,RW,RH); c.globalAlpha = 1;

  /* 2. nắng cửa sổ / ngược sáng */
  if(bc.beam === 1){
    c.save(); c.translate(RW*.70, 0); c.rotate(.14);
    [[-70,150],[112,60]].forEach(([x,w])=>{
      const bg2 = c.createLinearGradient(x, 0, x+w, 0);
      bg2.addColorStop(0,'rgba(255,250,238,0)');
      bg2.addColorStop(.5,'rgba(255,250,238,.55)');
      bg2.addColorStop(1,'rgba(255,250,238,0)');
      c.fillStyle = bg2; c.fillRect(x, -60, w, RH*1.25);
    });
    c.restore();
  } else if(bc.beam === 2){
    g = c.createRadialGradient(RW*.5, RH*.34, 0, RW*.5, RH*.34, RH*.42);
    g.addColorStop(0,'rgba(255,251,244,.72)'); g.addColorStop(1,'rgba(255,251,244,0)');
    c.fillStyle = g; c.fillRect(0,0,RW,RH);
  }

  const topY = RH*.17, botY = RH*.90;
  const cx = RW*(.5 + bc.dx), sc = bc.scale;

  /* 3. vệt sàn + bóng đổ */
  g = c.createLinearGradient(0, botY, 0, botY + RH*.05);
  g.addColorStop(0,'rgba(138,124,110,.16)'); g.addColorStop(1,'rgba(138,124,110,0)');
  c.fillStyle = g; c.fillRect(0, botY, RW, RH*.05);

  const hemG = (DANG_HINH[dang]||DANG_HINH.chuA).hem * RW * sc * 1.3;
  c.save();
  c.translate(cx, botY + RH*.018); c.scale(1, .11);
  g = c.createRadialGradient(0,0,0, 0,0, hemG);
  g.addColorStop(0,'rgba(96,84,72,.50)'); g.addColorStop(1,'rgba(96,84,72,0)');
  c.fillStyle = g; c.beginPath(); c.arc(0,0,hemG,0,7); c.fill();
  c.restore();

  /* 4. thân váy */
  const info = duongVay(c, dang, seed, cx, topY, botY, sc);
  c.save(); c.clip();

  const mv = VAI[dang] || VAI.xoe;
  g = c.createLinearGradient(cx - info.hemW, 0, cx + info.hemW, 0);
  g.addColorStop(0, mv[0]); g.addColorStop(.32, mv[1]);
  g.addColorStop(.60, mv[2]); g.addColorStop(1, mv[3]);
  c.fillStyle = g; c.fillRect(0,0,RW,RH);

  g = c.createLinearGradient(0, RH*.42, 0, RH*.95);
  g.addColorStop(0,'rgba(118,102,86,0)'); g.addColorStop(1,'rgba(118,102,86,.22)');
  c.fillStyle = g; c.fillRect(0,0,RW,RH);

  const soNep = 8 + Math.floor(rnd()*4);
  for(let i=0;i<soNep;i++){
    const ox = cx + (rnd()-.5)*.50*RW;
    const y0 = RH*(.33 + rnd()*.12);
    const spread = .5 + rnd()*1.1;
    const w0 = 5 + rnd()*10, w1 = w0*(1.6 + rnd()*1.8);

    const toi = (dang==='vest');

           sang ? 'rgba(255,255,255,$)' : (toi ? 'rgba(0,0,0,$)' : 'rgba(146,128,110,$)'),
           sang ? (toi ? (.10+rnd()*.12).toFixed(2) : (.20+rnd()*.22).toFixed(2))
                : (.10+rnd()*.16).toFixed(2));
  }

  if(dang === 'vest'){
    // ve áo chữ V
    c.fillStyle = 'rgba(255,255,255,.09)';
    c.beginPath();
    c.moveTo(cx - info.nw*.92, topY);
    c.lineTo(cx, topY + RH*.20);
    c.lineTo(cx + info.nw*.92, topY);
    c.lineTo(cx + info.nw*.55, topY);
    c.lineTo(cx, topY + RH*.14);
    c.lineTo(cx - info.nw*.55, topY);
    c.closePath(); c.fill();
    // đường nẹp giữa + cúc
    c.fillStyle = 'rgba(0,0,0,.30)';
    c.fillRect(cx - 1.5, topY + RH*.18, 3, RH*.30);
    c.fillStyle = 'rgba(220,215,205,.55)';
    for(let k=0;k<3;k++) c.beginPath(),
      c.arc(cx, topY + RH*(.26 + k*.055), 4.2, 0, 7), c.fill();
  }
  // đai eo
  g = c.createLinearGradient(0, info.waistY - RH*.012, 0, info.waistY + RH*.024);
  g.addColorStop(0,'rgba(190,172,150,0)'); g.addColorStop(.5,'rgba(190,172,150,.55)');
  g.addColorStop(1,'rgba(190,172,150,0)');
  if(dang !== 'vest'){
    c.fillStyle = g;
    c.fillRect(cx - RW*.085*sc, info.waistY - RH*.012, RW*.17*sc, RH*.036);
  }

  // xẻ tà áo dài
  if(dang === 'aodai'){
    const sy = lerp(topY, botY, .60);
    g = c.createLinearGradient(cx - 7, 0, cx + 7, 0);
    g.addColorStop(0,'rgba(118,102,86,0)'); g.addColorStop(.5,'rgba(118,102,86,.34)');
    g.addColorStop(1,'rgba(118,102,86,0)');
    c.fillStyle = g; c.fillRect(cx - 7, sy, 14, botY - sy);
  }
  c.restore();

  /* 5. viền sáng */
  duongVay(c, dang, seed, cx, topY, botY, sc);
  g = c.createLinearGradient(cx - info.hemW, 0, cx + info.hemW, 0);
  g.addColorStop(0,'rgba(255,255,255,.15)'); g.addColorStop(.7,'rgba(255,255,255,.75)');
  g.addColorStop(1,'rgba(255,255,255,.25)');
  c.strokeStyle = g; c.lineWidth = 1.8; c.stroke();

  /* 6. vignette */
  g = c.createRadialGradient(RW*.5, RH*.44, RH*.32, RW*.5, RH*.5, RH*.84);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(58,47,39,.20)');
  c.fillStyle = g; c.fillRect(0,0,RW,RH);

  /* 7. dấu thương hiệu */
  c.font = '500 12px Inter, system-ui, sans-serif';
  c.fillStyle = 'rgba(255,255,255,.45)';
  c.fillText('M R   H Ạ N H   P H Ú C', 20, RH - 20);

  /* 8. cắt khung theo bố cục */
  const [fx,fy,fw,fh] = bc.cam;
  canvas.width = RW; canvas.height = RH;
  const t = canvas.getContext('2d');
  t.imageSmoothingQuality = 'high';
  t.drawImage(off, fx*RW, fy*RH, fw*RW, fh*RH, 0, 0, RW, RH);

  /* 9. hạt phim */
  t.globalAlpha = .26; t.globalCompositeOperation = 'overlay';
  t.fillStyle = t.createPattern(oNhieu(), 'repeat');
  t.fillRect(0, 0, RW, RH);
  t.globalAlpha = 1; t.globalCompositeOperation = 'source-over';

  return bc.ten;
}

(function(){
"use strict";
const $=(s,p)=>(p||document).querySelector(s), $$=(s,p)=>[...(p||document).querySelectorAll(s)];

let moKhoa = false;
let dangSua = null;                     // slug mục đang mở form

/* ─── kiểm tra mã ─── */
async function bam(txt){
  const d = new TextEncoder().encode(txt);
  const h = await crypto.subtle.digest('SHA-256', d);
  return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* ─── nén ảnh khi tải lên ─── */
function nenAnh(file, w, h, chatLuong){
  return new Promise((ok, loi)=>{
    const fr = new FileReader();
    fr.onerror = ()=>loi(new Error('Không đọc được file'));
    fr.onload = ()=>{
      const im = new Image();
      im.onerror = ()=>loi(new Error('File không phải ảnh'));
      im.onload = ()=>{
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        const c = cv.getContext('2d');
        // cắt giữa theo tỉ lệ 3:4
        const tl = w/h, tlA = im.width/im.height;
        let sw, sh, sx, sy;
        if(tlA > tl){ sh = im.height; sw = sh*tl; sx = (im.width-sw)/2; sy = 0; }
        else        { sw = im.width;  sh = sw/tl; sx = 0; sy = (im.height-sh)/2; }
        c.imageSmoothingQuality = 'high';
        c.drawImage(im, sx, sy, sw, sh, 0, 0, w, h);
        ok(cv.toDataURL('image/jpeg', chatLuong));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ─── đo dung lượng ảnh đã tải lên ─── */
function tongDungLuong(){
  let b = 0;
  MUC.forEach(m => (m.anh||[]).forEach(u => { if(u) b += u.length*0.75; }));
  return b;
}
const doMB = b => (b/1024/1024).toFixed(1);

/* ─── sinh lại khối dữ liệu để dán vào file ─── */
function khoiDuLieu(nhungAnh){
  const dong = MUC.map(m=>{
    const p = [];
    p.push(`ten:${JSON.stringify(m.ten)}`);
    p.push(`slug:${JSON.stringify(m.slug)}`);
    p.push(`dm:${JSON.stringify(m.dm)}`);
    p.push(`dang:${JSON.stringify(m.dang)}`);
    p.push(`gia:${JSON.stringify(m.gia||'')}`);
    p.push(`ghiChu:${JSON.stringify(m.ghiChu||'')}`);
    if(m.soAnh && m.soAnh !== SO_ANH) p.push(`soAnh:${m.soAnh}`);
    const coAnh = (m.anh||[]).some(Boolean);
    if(coAnh) p.push(nhungAnh ? `anh:${JSON.stringify(m.anh)}` : `anhNgoai:true`);
    return '  {' + p.join(', ') + '},';
  }).join('\n');
  return `const MUC = [\n${dong}\n];`;
}

/* ─── ghi file cho người dùng tải ─── */
function taiVe(ten, blob){
  const u = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = u; a.download = ten;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u), 8000);
}

/* ─── xuất index.html mới ─── */
async function xuatHTML(nhungAnh){
  let goc;
  try{
    const r = await fetch(location.pathname.endsWith('/') ? location.pathname+'index.html' : location.pathname,
                          {cache:'no-store'});
    if(!r.ok) throw 0;
    goc = await r.text();
    if(goc.indexOf('/*==DATA-START==*/') < 0) throw 0;
  }catch(_){
    window.__toast('Mở file bằng link web mới xuất được. Dùng nút "Sao chép khối dữ liệu" thay thế.');
    return;
  }
  const a = goc.indexOf('/*==DATA-START==*/');
  const b = goc.indexOf('/*==DATA-END==*/');
  const giua = goc.slice(a, b);
  const moi = giua.replace(/const MUC = \[[\s\S]*?\n\];/, khoiDuLieu(nhungAnh));
  let ra = goc.slice(0,a) + moi + goc.slice(b);
  if(nhungAnh || MUC.some(x=>x.anh)) ra = ra.replace('const DEMO = true;','const DEMO = true;');
  taiVe('index.html', new Blob([ra], {type:'text/html;charset=utf-8'}));
  window.__toast('Đã tải index.html — upload đè lên GitHub là xong');
}

/* ─── ZIP tối giản (không nén, đủ cho GitHub) ─── */
const crcBang = (()=>{ const t=new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; }
  return t; })();
function crc32(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c = crcBang[(c^u8[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function b64ToU8(dataUrl){
  const s = atob(dataUrl.split(',')[1]);
  const u = new Uint8Array(s.length);
  for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i);
  return u;
}
function taoZip(files){                         // files: [{ten, data:Uint8Array}]
  const enc = new TextEncoder(), phan = [], muc = [];
  let off = 0;
  files.forEach(f=>{
    const ten = enc.encode(f.ten), crc = crc32(f.data), n = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0,true);
    lh.setUint16(8,0,true); lh.setUint16(10,0,true); lh.setUint16(12,0,true);
    lh.setUint32(14,crc,true); lh.setUint32(18,n,true); lh.setUint32(22,n,true);
    lh.setUint16(26,ten.length,true); lh.setUint16(28,0,true);
    phan.push(new Uint8Array(lh.buffer), ten, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true);
    ch.setUint16(8,0,true); ch.setUint16(10,0,true); ch.setUint16(12,0,true); ch.setUint16(14,0,true);
    ch.setUint32(16,crc,true); ch.setUint32(20,n,true); ch.setUint32(24,n,true);
    ch.setUint16(28,ten.length,true); ch.setUint16(30,0,true); ch.setUint16(32,0,true);
    ch.setUint16(34,0,true); ch.setUint16(36,0,true); ch.setUint32(38,0,true); ch.setUint32(42,off,true);
    muc.push(new Uint8Array(ch.buffer), ten);
    off += 30 + ten.length + n;
  });
  const cdOff = off;
  let cdLen = 0; muc.forEach(m=>cdLen += m.length);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(4,0,true); end.setUint16(6,0,true);
  end.setUint16(8,files.length,true); end.setUint16(10,files.length,true);
  end.setUint32(12,cdLen,true); end.setUint32(16,cdOff,true); end.setUint16(20,0,true);
  return new Blob([...phan, ...muc, new Uint8Array(end.buffer)], {type:'application/zip'});
}
function xuatZip(){
  const files = [];
  MUC.forEach(m=>{
    (m.anh||[]).forEach((u,i)=>{ if(u) files.push({ten:`anh/${m.slug}/${i+1}.jpg`, data:b64ToU8(u)}); });
  });
  if(!files.length) return window.__toast('Chưa có ảnh nào được tải lên');
  taiVe('anh.zip', taoZip(files));
  window.__toast(`Đã tải ${files.length} ảnh — giải nén vào repo, cạnh index.html`);
}

}

function doiCho(i, huong){
  const j = i + huong;
  if(j < 0 || j >= MUC.length) return;

function gan(form){
  const i = +form.dataset.i, m = MUC[i];

  form.addEventListener('input', e=>{
    const t = e.target, f = t.dataset.f; if(!f) return;
    if(f==='slug') m.slug = t.value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'');
    else m[f] = t.value;
    window.__dungLai();
  });

  const inp = $('input[data-up]', form);
  if(inp) inp.addEventListener('change', async e=>{
    m.anh = m.anh || [];
    const fs = [...e.target.files].slice(0, SO_ANH - m.anh.length);
    if(!fs.length) return window.__toast(`Mục này đã đủ ${SO_ANH} ảnh`);
    window.__toast(`Đang xử lý ${fs.length} ảnh…`);
    for(const f of fs){
      try{ m.anh.push(await nenAnh(f, 720, 960, .78)); }
      catch(err){ window.__toast('Bỏ qua 1 file: '+err.message); }
    }
    window.__dungLai(); manQuanTri();
    window.__toast(`Đã thêm ${fs.length} ảnh`);
  });

  $$('[data-xoa]', form).forEach(b=>b.addEventListener('click', ()=>{
    m.anh.splice(+b.dataset.xoa,1); window.__dungLai(); manQuanTri();
  }));

  const del = $('[data-xoabo]', form);
  if(del) del.addEventListener('click', ()=>{
    if(!confirm(`Xoá "${m.ten}"? Không hoàn tác được.`)) return;
    MUC.splice(i,1); dangSua = null; window.__dungLai(); manQuanTri();
    window.__toast('Đã xoá');
  });
  const ok = $('[data-luu]', form);
  if(ok) ok.addEventListener('click', ()=>{ dangSua = null; manQuanTri(); window.__toast('Đã cập nhật'); });
}

"use strict";
const $=(s,p)=>(p||document).querySelector(s), $$=(s,p)=>[...(p||document).querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ────────── bộ nhớ ảnh đã vẽ ────────── */
const CACHE = new Map();
const THUTU = [];

/* ────────── dựng danh sách mẫu từ MUC ────────── */
let VAY = [];
function dungLai(){
  VAY = MUC.map((m, i) => {
    const rieng = (m.anh || []).filter(Boolean);
    return {
      ...m,
      i,
      dmTen: (DANH_MUC.find(d=>d.id===m.dm) || {}).ten || m.dm,
      dangTen: TEN_DANG[m.dang] || m.dang,
      seed: i + 1,
      anhRieng: rieng,
      anhNgoai: !!m.anhNgoai,
      anh: Array.from({length: rieng.length || m.soAnh || SO_ANH}, (_,n)=>n+1)
    };
  });
  CACHE.clear(); THUTU.length = 0;
}
const timVay = s => VAY.find(v=>v.slug===s);

/* ────────── ảnh: vẽ bằng canvas rồi nhớ lại ────────── */
function anhURL(v, n){
  if(v.anhRieng && v.anhRieng[n-1]) return v.anhRieng[n-1];
  if(v.anhNgoai || !DEMO) return `./anh/${v.slug}/${n}.jpg`;
  const key = v.slug+'|'+n;
  if(CACHE.has(key)) return CACHE.get(key);
  const cv = document.createElement('canvas');
  veAnh(cv, v.dang, v.seed, n-1);
  const url = cv.toDataURL('image/jpeg', .82);
  CACHE.set(key, url); THUTU.push(key);
  while(THUTU.length > 240) CACHE.delete(THUTU.shift());
  return url;
}
function tenBoCuc(n){ return BOCUC[(n-1) % BOCUC.length].ten; }

/* hàng đợi vẽ: mỗi khung hình chỉ dựng vài tấm, tránh treo giao diện */
const hangDoi = [];
let dangChay = false;
function xepHang(fn){ hangDoi.push(fn); if(!dangChay){ dangChay = true; requestAnimationFrame(chay); } }
function chay(){
  const han = performance.now() + 14;      // giữ dưới ~1 khung hình
  while(hangDoi.length && performance.now() < han) hangDoi.shift()();
  if(hangDoi.length) requestAnimationFrame(chay); else dangChay = false;
}

/* nạp ảnh khi cuộn tới, tránh dựng cả 1000 tấm một lúc */
const lazyIO = new IntersectionObserver(es=>{
  es.forEach(e=>{
    if(!e.isIntersecting) return;
    const el = e.target; lazyIO.unobserve(el);
    const v = timVay(el.dataset.v), n = +el.dataset.n || 1;
    xepHang(()=>{
      const im = el.tagName==='IMG' ? el : $('img', el);
      if(!im || !v) return;
      im.onload = ()=>im.classList.add('ready');
      im.onerror = ()=>im.classList.add('ready');
      im.src = anhURL(v, n);
      if(im.complete) im.classList.add('ready');
    });
  });
},{rootMargin:'500px 0px'});

const revIO = new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){ e.target.classList.add('in'); revIO.unobserve(e.target); }
}),{threshold:.04, rootMargin:'0px 0px -4% 0px'});

/* ────────── thông báo ────────── */
let tT; function toast(m){ $('#toastTxt').textContent=m; $('#toast').classList.add('on');
  clearTimeout(tT); tT=setTimeout(()=>$('#toast').classList.remove('on'),2500); }

/* ────────── yêu thích ────────── */
const favs=new Set();
function toggleFav(slug,quiet){
  favs.has(slug)?favs.delete(slug):favs.add(slug);
  syncFav(); if(!quiet) toast(favs.has(slug)?'Đã lưu vào váy khách thích ♥':'Đã bỏ khỏi danh sách');
}
function syncFav(){
  const b=$('#favBadge'); b.textContent=favs.size; b.classList.toggle('on',favs.size>0);
  $('#drCount').textContent=favs.size?`(${favs.size})`:'';
  $$('.heart').forEach(h=>{const on=favs.has(h.dataset.slug);
    h.classList.toggle('on',on); h.setAttribute('aria-pressed',on);});
  drawFav();
}
function drawFav(){
  const body=$('#drBody');
  if(!favs.size){
    body.innerHTML=`<div class="empty"><svg viewBox="0 0 24 24" stroke-linecap="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l8.8 8.8 8.8-8.8a5.5 5.5 0 0 0 0-7.8z"/></svg>
      <div>Chưa chọn mẫu nào.<br>Bấm ♥ trên mẫu khách ưng để lưu lại.</div></div>`;
    return;
  }
  body.innerHTML = VAY.filter(v=>favs.has(v.slug)).map(v=>`
    <div class="dr-row" data-go="${v.slug}">
      <img alt="" src="${anhURL(v,1)}">
      <div><b>${v.ten}</b>
        <small class="price">${v.gia}</small>
        <small class="note" style="color:var(--muted);display:block">${v.dmTen}</small></div>
      <button data-rm="${v.slug}" aria-label="Bỏ"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>`).join('');
  $$('.dr-row',body).forEach(r=>r.addEventListener('click',e=>{
    const rm=e.target.closest('[data-rm]');
    if(rm){ toggleFav(rm.dataset.rm); return; }
    drawer(false); location.hash='#/muc/'+r.dataset.go;
  }));
}
function drawer(v){ $('#drawer').classList.toggle('open',v); $('#scrim').classList.toggle('open',v);
  document.body.classList.toggle('lock',v); }
$('#favBtn').addEventListener('click',()=>drawer(true));
$('#drClose').addEventListener('click',()=>drawer(false));
$('#scrim').addEventListener('click',()=>drawer(false));
$('#drClear').addEventListener('click',()=>{favs.clear();syncFav();toast('Đã xoá danh sách');});
$('#drCopy').addEventListener('click',async()=>{
  if(!favs.size) return toast('Chưa chọn mẫu nào');
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  const lines=VAY.filter(v=>favs.has(v.slug))
    .map((v,k)=>`${k+1}. ${v.ten} (${v.dmTen})${v.gia?' — '+v.gia:''}`);
  const txt=`MR HẠNH PHÚC — Váy khách thích\n${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()}\n\n`+lines.join('\n');
  try{ await navigator.clipboard.writeText(txt); toast('Đã sao chép — dán vào Zalo được rồi'); }
  catch(_){ toast('Trình duyệt chặn sao chép, bạn chụp màn hình nhé'); }
});

/* ────────── tìm kiếm + lọc dáng ────────── */
let kw='', locDM='all';
function hopLe(v){
  if(locDM!=='all' && v.dm!==locDM) return false;
  if(!kw) return true;
  return (v.ten+' '+v.dmTen+' '+v.dangTen+' '+(v.gia||'')+' '+(v.ghiChu||'')).toLowerCase().includes(kw);
}
$('#searchBtn').addEventListener('click',()=>{
  const b=$('#searchBox'); b.classList.toggle('open');
  if(b.classList.contains('open')) $('#q').focus();
  else { kw=''; $('#q').value=''; render(); }
});
let qT; $('#q').addEventListener('input',e=>{
  clearTimeout(qT); qT=setTimeout(()=>{ kw=e.target.value.trim().toLowerCase();
    if(location.hash.startsWith('#/vay/')) location.hash='#/'; else render(); },240);
});
$('#qClear').addEventListener('click',()=>{ $('#q').value=''; kw=''; $('#q').focus(); render(); });

function veTabs(){
  const ds=[{id:'all',ten:'Tất cả'}].concat(DANH_MUC);
  $('#tabs').innerHTML = ds.map(d=>{
    const n = d.id==='all' ? VAY.length : VAY.filter(v=>v.dm===d.id).length;
    return `<button class="tab${d.id===locDM?' on':''}" data-d="${d.id}">${d.ten} (${n})</button>`;
  }).join('');
  $$('#tabs .tab').forEach(t=>t.addEventListener('click',()=>{
    locDM=t.dataset.d; veTabs();
    if(location.hash.startsWith('#/muc/')) location.hash='#/'; else render();
    $('#tabs .tab.on')?.scrollIntoView({inline:'center',block:'nearest',behavior:RM?'auto':'smooth'});
  }));
}

/* ══════════ MÀN 1 — LƯỚI MẪU / ALBUM ══════════ */
function manDanhSach(){
  const ds = VAY.filter(hopLe);
  const v = $('#view');
  if(!ds.length){
    v.innerHTML=`<div class="empty"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
      <div>Không tìm thấy mục nào${kw?` cho “${kw}”`:''}.</div></div>`;
    return;
  }
  const nhan = locDM==='all' ? 'Tất cả' : (DANH_MUC.find(d=>d.id===locDM)||{}).ten;
  v.innerHTML = `<p class="count-line">${nhan} · ${ds.length} mục${kw?` · tìm: ${kw}`:''}</p>
    <div class="albums">` + ds.map(a=>`
      <article class="alb" data-go="${a.slug}">
        <div class="alb-img">
          <img alt="${a.ten}" data-v="${a.slug}" data-n="1">
          <button class="heart" data-slug="${a.slug}" aria-label="Khách thích ${a.ten}" aria-pressed="false">
            <svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l8.8 8.8 8.8-8.8a5.5 5.5 0 0 0 0-7.8z"/></svg>
          </button>
          <span class="alb-n"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m3 15 5-5 4 4 3-3 6 6"/></svg>${a.anh.length}</span>
          ${locDM==='all' ? `<span class="alb-dm">${a.dmTen}</span>` : ''}
        </div>
        <div class="alb-meta"><h3>${a.ten}</h3>
          ${a.gia?`<span class="price">${a.gia}</span>`:''}
          ${a.ghiChu?`<span class="note">${a.ghiChu}</span>`:''}
        </div>
      </article>`).join('') + `</div>`;
  $$('.alb',v).forEach((el,k)=>{
    el.style.transitionDelay=Math.min(k,12)*30+'ms'; revIO.observe(el);
    lazyIO.observe($('img',el));
    el.addEventListener('click',e=>{ if(e.target.closest('.heart')) return;
      location.hash='#/muc/'+el.dataset.go; });
  });
  $$('.heart',v).forEach(h=>h.addEventListener('click',()=>toggleFav(h.dataset.slug)));
  syncFav();
}


/* ══════════ MÀN 2 — ẢNH CỦA MỘT MỤC ══════════ */
function manMuc(slug){
  const a=timVay(slug); if(!a){ location.hash='#/'; return; }
  const v=$('#view');
  v.innerHTML = `
    <nav class="crumb">
      <a href="#/"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>Trang chủ</a>
      <span>›</span><a href="#/" data-dm="${a.dm}">${a.dmTen}</a>
      <span>›</span><b>${a.ten}</b>
    </nav>
    <section class="cover">
      <div class="cover-side"><div class="cover-img"><img alt="${a.ten}" data-v="${a.slug}" data-n="1"></div></div>
      <div class="cover-txt">
        <h1>${a.ten}</h1>
        <div class="cover-rule"></div>
        <div class="d">${a.dmTen} · ${a.anh.length} ảnh</div>
        ${a.gia?`<p class="p price">${a.gia}</p>`:''}
        ${a.ghiChu?`<p class="nt note">${a.ghiChu}</p>`:''}
        <div class="cover-acts">
          <button class="btn" id="playAll">Trình chiếu
            <svg viewBox="0 0 24 24"><path d="m6 4 13 8-13 8z" fill="currentColor" stroke="none"/></svg></button>
          <button class="btn ghost" id="likeThis">
            <svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l8.8 8.8 8.8-8.8a5.5 5.5 0 0 0 0-7.8z"/></svg>
            <span id="likeTxt">Khách thích mục này</span></button>
        </div>
      </div><div></div>
    </section>
    <section class="shots">` + a.anh.map(n=>`
      <figure class="shot" data-k="${n-1}" style="margin:0">
        <img alt="${a.ten} — ${tenBoCuc(n)}" data-v="${a.slug}" data-n="${n}">
        <figcaption>${tenBoCuc(n)}</figcaption>
      </figure>`).join('') + `</section>`;
  lazyIO.observe($('.cover-img img',v));
  $('[data-dm]',v).addEventListener('click',()=>{ locDM=a.dm; veTabs(); });
  $$('.shot',v).forEach((s2,k)=>{ s2.style.transitionDelay=Math.min(k,9)*40+'ms';
    revIO.observe(s2); lazyIO.observe($('img',s2));
    s2.addEventListener('click',()=>openLB(a,k)); });
  $('#playAll').addEventListener('click',()=>openLB(a,0,true));
  const lk=$('#likeThis');
  const sync=()=>{ const on=favs.has(a.slug); lk.classList.toggle('ghost',!on);
    $('#likeTxt').textContent=on?'Đã lưu ♥':'Khách thích mục này'; };
  lk.addEventListener('click',()=>{toggleFav(a.slug);sync();}); sync();
  scrollTo({top:0,behavior:'auto'});
}

/* ══════════ LIGHTBOX ══════════ */
const LB={open:false,list:[],i:0,vay:null};
(function(){
  const root=$('#lb'),track=$('#lbTrack'),stage=$('#lbStage'),thumbs=$('#lbThumbs');
  let dx=0,drag=false,sx=0,sy=0,ax=null,W=innerWidth;
  let z=1,px=0,py=0,pan=false,pxs=0,pys=0;
  let play=false,raf=null,t0=0; const SDUR=4000;

  function paint(an){ track.style.transition=an&&!RM?'transform .5s cubic-bezier(.22,1,.36,1)':'none';
    track.style.transform=`translate3d(${-LB.i*W+dx}px,0,0)`; }
  function zp(){ const im=$$('.lb-item img',track)[LB.i]; if(!im) return;
    im.style.transform=`translate3d(${px}px,${py}px,0) scale(${z})`;
    im.style.cursor=z>1?'grab':'zoom-in'; }
  function rz(){ z=1;px=0;py=0; $$('.lb-item img',track).forEach(i=>i.style.transform=''); }
  function nap(k){
    const im=$$('.lb-item img',track)[k];
    if(im && !im.src) im.src = anhURL(LB.vay, LB.list[k]);
    const th=$$('img',thumbs)[k];
    if(th && !th.src) th.src = anhURL(LB.vay, LB.list[k]);
  }
  function fill(){
    $('#lbTitle').textContent = LB.vay.ten + ' — ' + tenBoCuc(LB.list[LB.i]);
    $('#lbCount').textContent = `${LB.i+1} / ${LB.list.length}`;
    [LB.i-1,LB.i,LB.i+1].forEach(k=>{ if(k>=0&&k<LB.list.length) nap(k); });
    $$('img',thumbs).forEach((t,k)=>{ t.classList.toggle('on',k===LB.i);
      if(k===LB.i) t.scrollIntoView({inline:'center',block:'nearest',behavior:RM?'auto':'smooth'}); });
  }
  function go(k){ LB.i=clamp(k,0,LB.list.length-1); dx=0; rz(); paint(true); fill(); t0=performance.now(); }

  window.openLB=function(a,idx,autoplay){
    LB.vay=a; LB.list=a.anh; LB.i=clamp(idx||0,0,a.anh.length-1); LB.open=true; W=innerWidth;
    track.innerHTML=a.anh.map(()=>`<div class="lb-item"><img alt="" draggable="false"></div>`).join('');
    thumbs.innerHTML=a.anh.map((n,k)=>`<img alt="" data-k="${k}">`).join('');
    $$('img',thumbs).forEach(t=>t.addEventListener('click',()=>go(+t.dataset.k)));
    [LB.i, LB.i+1, LB.i-1].forEach(k=>{ if(k>=0&&k<a.anh.length) nap(k); });
    rz(); paint(false); fill();
    root.classList.add('open'); document.body.classList.add('lock');
    setPlay(!!autoplay); $('#lbClose').focus({preventScroll:true});
    for(let k=0;k<a.anh.length;k++) xepHang(()=>nap(k));
  };
  function close(){ LB.open=false; setPlay(false); root.classList.remove('open');
    if(!$('#drawer').classList.contains('open')) document.body.classList.remove('lock'); }

  stage.addEventListener('pointerdown',e=>{
    if(e.target.closest('button')) return;
    stage.setPointerCapture(e.pointerId);
    if(z>1){ pan=true; pxs=e.clientX-px; pys=e.clientY-py; return; }
    drag=true; ax=null; sx=e.clientX; sy=e.clientY; setPlay(false);
  });
  stage.addEventListener('pointermove',e=>{
    if(pan){ px=e.clientX-pxs; py=e.clientY-pys; zp(); return; }
    if(!drag) return;
    const mx=e.clientX-sx,my=e.clientY-sy;
    if(ax===null){ if(Math.abs(mx)<6&&Math.abs(my)<6) return; ax=Math.abs(mx)>Math.abs(my)?'x':'y'; }
    if(ax!=='x') return;
    dx=mx*((LB.i===0&&mx>0)||(LB.i===LB.list.length-1&&mx<0)?.3:1); paint(false);
  });
  function up(){ if(pan){pan=false;return;} if(!drag) return; drag=false;
    const th=Math.min(W*.14,110);
    if(dx<-th) LB.i=Math.min(LB.i+1,LB.list.length-1); else if(dx>th) LB.i=Math.max(LB.i-1,0);
    dx=0; paint(true); fill(); }
  stage.addEventListener('pointerup',up); stage.addEventListener('pointercancel',up);
  stage.addEventListener('dblclick',e=>{ if(e.target.tagName==='IMG'){ z=z>1?1:2.3; px=py=0; zp(); }});
  stage.addEventListener('wheel',e=>{ if(!LB.open) return; e.preventDefault();
    z=clamp(z+(e.deltaY<0?.25:-.25),1,4); if(z===1){px=py=0;} zp(); },{passive:false});

  $('#lbClose').addEventListener('click',close);
  $('#lbHome').addEventListener('click',()=>{ close(); location.hash='#/'; });
  $('#lbPrev').addEventListener('click',()=>go(LB.i-1));
  $('#lbNext').addEventListener('click',()=>go(LB.i+1));
  $('#lbZoom').addEventListener('click',()=>{ z=z>1?1:2.3; px=py=0; zp(); });
  $('#lbDl').addEventListener('click',()=>{
    const u=$$('.lb-item img',track)[LB.i].src;
    const a=document.createElement('a');
    a.href=u; a.download=`${LB.vay.slug}-${LB.i+1}.jpg`;
    document.body.appendChild(a); a.click(); a.remove();
    toast('Đang tải ảnh…');
  });
  $('#lbShare').addEventListener('click',async()=>{
    const url=location.href.split('#')[0]+'#/muc/'+LB.vay.slug;
    try{ if(navigator.share) await navigator.share({title:LB.vay.ten,url});
      else { await navigator.clipboard.writeText(url); toast('Đã sao chép liên kết'); } }
    catch(_){ toast('Liên kết: '+url); }
  });
  function setPlay(v){ play=v; $('#lbPlay').classList.toggle('on',v);
    if(v){ t0=performance.now(); tick(); }
    else { cancelAnimationFrame(raf); $('#lbPlay').style.setProperty('--p','0deg'); } }
  function tick(){ if(!play) return; const e=performance.now()-t0;
    $('#lbPlay').style.setProperty('--p',(Math.min(e/SDUR,1)*360)+'deg');
    if(e>=SDUR){ LB.i=LB.i>=LB.list.length-1?0:LB.i+1; dx=0; rz(); paint(true); fill(); t0=performance.now(); }
    raf=requestAnimationFrame(tick); }
  $('#lbPlay').addEventListener('click',()=>setPlay(!play));

  addEventListener('keydown',e=>{
    if(!LB.open) return;
    if(e.key==='Escape')close();
    else if(e.key==='ArrowRight')go(LB.i+1);
    else if(e.key==='ArrowLeft')go(LB.i-1);
    else if(e.key===' '){e.preventDefault();setPlay(!play);}
  });
  addEventListener('resize',()=>{W=innerWidth; if(LB.open)paint(false);});
})();

/* ────────── chế độ khách / giao diện ────────── */
function guest(v){ document.body.classList.toggle('guest',v); $('#guestBtn').classList.toggle('on',v);
  toast(v?'Chế độ khách — đã ẩn giá':'Đã hiện lại giá'); }
$('#guestBtn').addEventListener('click',()=>guest(!document.body.classList.contains('guest')));
$('#guestOff').addEventListener('click',()=>guest(false));
$('#themeBtn').addEventListener('click',()=>{
  const d=document.documentElement.dataset.theme==='dark';
  document.documentElement.dataset.theme=d?'light':'dark';
  $('#icSun').style.display=d?'':'none'; $('#icMoon').style.display=d?'none':'';
});

/* ────────── điều hướng ────────── */
function render(){
  const h=location.hash;
  let m;
  const laAdmin = h.startsWith('#/admin');
  document.body.classList.toggle('admin-mode', laAdmin);
  if(laAdmin)                            window.__admin();
  else if((m=/^#\/muc\/(.+)$/.exec(h))) manMuc(decodeURIComponent(m[1]));
  else                                   manDanhSach();
}
addEventListener('hashchange',render);
window.__toast = toast;
window.__dungLai = function(){ dungLai(); veTabs(); };
dungLai();
veTabs(); render(); syncFav();
requestAnimationFrame(()=>requestAnimationFrame(()=>{
  const b=$('#boot'); if(b) b.classList.add('done');
}));

/* ────────── PWA ────────── */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
addEventListener('beforeinstallprompt',e=>{
  e.preventDefault(); const dp=e;
  const b=document.createElement('button'); b.className='btn';
  b.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:650';
  b.innerHTML='Cài app vào máy <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>';
  b.onclick=async()=>{ b.remove(); dp.prompt(); await dp.userChoice; };
  document.body.appendChild(b); setTimeout(()=>b.remove(),15000);
});
})();

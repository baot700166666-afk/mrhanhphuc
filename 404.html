<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MR HẠNH PHÚC — Catalogue váy cưới</title>
<meta name="description" content="Ứng dụng nội bộ tra cứu & giới thiệu váy cưới cho khách.">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#141110">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MR HẠNH PHÚC">
<link rel="apple-touch-icon" href="./icon/icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23141110'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='30' fill='%23B4603C' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F1EB; --bg-2:#EFE8DF; --card:#FFFFFF;
  --ink:#181513; --muted:#7A7169; --line:rgba(24,21,19,.13);
  --accent:#9C3B3B; --accent-soft:#F1DFDB;
  --shadow:0 20px 50px -22px rgba(24,21,19,.3);
  --r:14px; --r-lg:22px; --head-h:132px;
  --ease:cubic-bezier(.22,1,.36,1);
}
[data-theme="dark"]{
  --bg:#0D0C0B; --bg-2:#16130F; --card:#141210;
  --ink:#F4F0E9; --muted:#9C9288; --line:rgba(244,240,233,.15);
  --accent:#D97A6C; --accent-soft:#2A1D1B;
  --shadow:0 20px 50px -22px rgba(0,0,0,.75);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  transition:background .4s var(--ease),color .4s var(--ease)}
body.lock{overflow:hidden}
img{display:block;max-width:100%}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.serif{font-family:"Instrument Serif",Georgia,serif;font-weight:400}
.wrap{width:min(1500px,94vw);margin-inline:auto}
.up{letter-spacing:.16em;text-transform:uppercase}

/* ============ HEADER ============ */
.top{position:sticky;top:0;z-index:500;background:color-mix(in srgb,var(--bg) 93%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 0 0}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-family:"Instrument Serif",serif;font-weight:400;font-size:clamp(19px,4.6vw,25px);letter-spacing:.06em}
.brand i{width:5px;height:5px;border-radius:50%;background:var(--accent);display:block}
.tools{position:absolute;top:12px;right:max(12px,3vw);display:flex;gap:6px;align-items:center}
.tools-l{position:absolute;top:12px;left:max(12px,3vw);display:flex;gap:6px;align-items:center}
.ic{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;
  transition:.28s var(--ease);position:relative;flex:none;background:var(--bg)}
.ic:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ic svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ic.on{background:var(--accent);border-color:var(--accent);color:#fff}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;
  background:var(--accent);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;
  transform:scale(0);transition:transform .3s var(--ease)}
.badge.on{transform:scale(1)}

/* tabs */
.tabs{display:flex;gap:0;overflow-x:auto;max-width:100%;padding:2px max(12px,3vw) 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 15px 14px;font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);
  white-space:nowrap;position:relative;transition:color .25s;font-weight:400}
.tab::after{content:"";position:absolute;left:15px;right:15px;bottom:0;height:2px;background:var(--accent);
  transform:scaleX(0);transition:transform .3s var(--ease)}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);font-weight:500}
.tab.on::after{transform:scaleX(1)}

/* search */
.search{width:min(560px,90vw);margin:0 auto 14px;position:relative;display:none}
.search.open{display:block}
.search input{width:100%;padding:12px 42px 12px 42px;border:1px solid var(--line);border-radius:100px;
  background:var(--card);font-size:14.5px;transition:border-color .25s}
.search input:focus{outline:none;border-color:var(--accent)}
.search .mag{position:absolute;left:15px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted)}
.search .mag svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7}
.search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;
  border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.search .clr svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

/* ============ ALBUM GRID ============ */
main{padding:clamp(22px,4vw,44px) 0 90px;min-height:70vh}
.count-line{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  margin:0 0 clamp(16px,3vw,26px);text-align:center}
.albums{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:clamp(20px,3vw,40px) clamp(14px,2vw,26px)}
@media (max-width:760px){.albums{grid-template-columns:repeat(2,1fr);gap:20px 10px}}
@media (max-width:330px){.albums{grid-template-columns:1fr}}
@media (max-width:760px){
  .alb-meta{padding-top:10px}
  .alb-meta h3{font-size:11px;letter-spacing:.1em}
  .alb-meta .price{font-size:12px}
  .alb-meta .note{font-size:11px}
  .heart{width:32px;height:32px}
  .brand b{letter-spacing:.04em}
}
.alb{cursor:pointer;opacity:0;transform:translateY(22px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.alb.in{opacity:1;transform:none}
.alb-img{position:relative;aspect-ratio:3/4;overflow:hidden;border-radius:var(--r);background:var(--bg-2)}
.alb-img img{width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease),filter .5s;filter:blur(12px)}
.alb-img img.ready{filter:none}
.alb:hover .alb-img img{transform:scale(1.05)}
.alb-n{position:absolute;left:10px;bottom:10px;padding:5px 10px;border-radius:100px;
  background:rgba(0,0,0,.45);backdrop-filter:blur(8px);color:#fff;font-size:10.5px;letter-spacing:.1em;
  display:flex;align-items:center;gap:5px}
.alb-n svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8}
.heart{position:absolute;top:9px;right:9px;width:36px;height:36px;border-radius:50%;z-index:2;
  background:rgba(255,255,255,.16);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.3);display:grid;place-items:center;color:#fff;transition:.3s var(--ease)}
.heart svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.heart:active{transform:scale(.86)}
.heart.on{background:var(--accent);border-color:var(--accent)}
.heart.on svg{fill:#fff}
.alb-meta{text-align:center;padding:13px 6px 0}
.alb-meta h3{margin:0;font-size:12.5px;letter-spacing:.15em;text-transform:uppercase;font-weight:500;line-height:1.5}
.alb-meta .price{display:block;margin-top:5px;font-size:12.5px;color:var(--accent);font-weight:500}
.alb-meta .note{display:block;margin-top:3px;font-size:12px;color:var(--muted)}
body.guest .price,body.guest .note{display:none}

/* empty */
.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.empty svg{width:44px;height:44px;stroke:var(--line);fill:none;stroke-width:1.2;margin-bottom:14px}

/* ============ ALBUM VIEW ============ */
.cover{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:clamp(20px,4vw,60px);
  min-height:min(78vh,760px);padding:clamp(20px,4vw,40px) 0}
.cover-side{justify-self:end}
.cover-img{width:min(430px,72vw);aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;
  background:var(--bg-2);box-shadow:var(--shadow)}
.cover-img img{width:100%;height:100%;object-fit:cover}
.cover-txt h1{font-family:"Instrument Serif",serif;font-weight:400;font-size:clamp(32px,5.2vw,58px);
  margin:0;line-height:1.1;letter-spacing:.01em}
.cover-rule{width:52px;height:1px;background:var(--accent);margin:18px 0}
.cover-txt .d{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cover-txt .p{font-size:19px;color:var(--accent);margin:14px 0 0;font-weight:500}
.cover-txt .nt{color:var(--muted);font-size:14px;margin:8px 0 0;max-width:34ch}
.cover-acts{display:flex;gap:9px;flex-wrap:wrap;margin-top:26px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:100px;
  background:var(--ink);color:var(--bg);font-size:12.5px;letter-spacing:.06em;
  border:1px solid var(--ink);transition:.3s var(--ease);white-space:nowrap}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:900px){
  .cover{grid-template-columns:1fr;min-height:auto;text-align:center;gap:24px}
  .cover-side{justify-self:center}
  .cover-rule{margin:16px auto}
  .cover-txt .nt{margin-inline:auto}
  .cover-acts{justify-content:center}
}
.back{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--muted);padding:10px 0;transition:color .25s}
.back:hover{color:var(--ink)}
.back svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,1.4vw,20px);padding-bottom:30px}
@media (max-width:820px){.shots{grid-template-columns:repeat(2,1fr);gap:8px}}
.shot{aspect-ratio:3/4;overflow:hidden;border-radius:var(--r);background:var(--bg-2);cursor:pointer;
  opacity:0;transform:translateY(20px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.shot.in{opacity:1;transform:none}
.shot img{width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease),filter .5s;filter:blur(12px)}
.shot img.ready{filter:none}
.shot:hover img{transform:scale(1.05)}

/* ============ LIGHTBOX ============ */
#lb{position:fixed;inset:0;z-index:800;background:color-mix(in srgb,var(--bg) 97%,transparent);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  opacity:0;visibility:hidden;transition:opacity .35s var(--ease),visibility .35s;display:flex;flex-direction:column}
#lb.open{opacity:1;visibility:visible}
.lb-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(12px,3vw);flex:none}
.lb-info h4{margin:0;font-size:12px;letter-spacing:.15em;text-transform:uppercase;font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-info small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.lb-tools{display:flex;gap:6px}
.lb-stage{flex:1;position:relative;overflow:hidden;touch-action:none;min-height:0}
.lb-track{position:absolute;inset:0;display:flex;will-change:transform}
.lb-item{flex:0 0 100%;height:100%;display:grid;place-items:center;padding:clamp(6px,2vw,26px)}
.lb-item img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;box-shadow:var(--shadow);
  will-change:transform;-webkit-user-drag:none;user-select:none;cursor:zoom-in}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:4;width:48px;height:48px;border-radius:50%;
  background:color-mix(in srgb,var(--bg) 72%,transparent);border:1px solid var(--line);
  backdrop-filter:blur(10px);display:grid;place-items:center;transition:.3s var(--ease)}
.lb-nav:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lb-nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.lb-prev{left:max(8px,2vw)}.lb-next{right:max(8px,2vw)}
@media (max-width:760px){.lb-nav{display:none}.lb-tools .ic{width:34px;height:34px}}
.lb-bot{flex:none;padding:8px max(12px,3vw) max(12px,env(safe-area-inset-bottom))}
.lb-thumbs{display:flex;gap:6px;overflow-x:auto;padding:5px 2px;scrollbar-width:none}
.lb-thumbs::-webkit-scrollbar{display:none}
.lb-thumbs img{width:50px;height:66px;object-fit:cover;border-radius:6px;flex:none;opacity:.38;
  cursor:pointer;transition:.3s var(--ease);border:2px solid transparent}
.lb-thumbs img.on{opacity:1;border-color:var(--accent)}
.lb-play::after{content:"";position:absolute;inset:-1px;border-radius:50%;
  background:conic-gradient(var(--accent) var(--p,0deg),transparent 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 2px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 2px));
  opacity:0;transition:opacity .3s;pointer-events:none}
.lb-play.on::after{opacity:1}
.lb-play svg:last-child{display:none}
.lb-play.on svg:first-child{display:none}
.lb-play.on svg:last-child{display:block}

/* ============ DRAWER ============ */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,100vw);z-index:700;background:var(--bg);
  border-left:1px solid var(--line);transform:translateX(101%);transition:transform .5s var(--ease);
  display:flex;flex-direction:column;box-shadow:var(--shadow)}
#drawer.open{transform:none}
#scrim{position:fixed;inset:0;z-index:690;background:rgba(0,0,0,.42);opacity:0;visibility:hidden;transition:.35s}
#scrim.open{opacity:1;visibility:visible}
.dr-top{display:flex;align-items:center;justify-content:space-between;padding:18px max(16px,4vw);
  border-bottom:1px solid var(--line);flex:none}
.dr-top h3{margin:0;font-size:12.5px;letter-spacing:.15em;text-transform:uppercase;font-weight:500}
.dr-body{flex:1;overflow-y:auto;padding:12px max(16px,4vw)}
.dr-row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.dr-row img{width:52px;height:68px;object-fit:cover;border-radius:8px;flex:none;background:var(--bg-2)}
.dr-row div{flex:1;min-width:0}
.dr-row b{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:500}
.dr-row small{color:var(--accent);font-size:12.5px}
.dr-row button{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.dr-row button:hover{background:var(--bg-2);color:var(--ink)}
.dr-row button svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.dr-foot{flex:none;padding:14px max(16px,4vw) max(18px,env(safe-area-inset-bottom));
  border-top:1px solid var(--line);display:flex;gap:8px}
.dr-foot .btn{flex:1;justify-content:center}

/* ============ misc ============ */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,220%);opacity:0;visibility:hidden;z-index:900;
  background:var(--ink);color:var(--bg);padding:12px 21px;border-radius:100px;font-size:13.5px;
  display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);max-width:90vw;
  transition:transform .45s var(--ease),opacity .3s,visibility .3s}
#toast.on{transform:translate(-50%,0);opacity:1;visibility:visible}
#drawer.open ~ #toast{bottom:96px}
#toast svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.guest-bar{position:fixed;left:50%;transform:translate(-50%,150%);bottom:18px;z-index:600;
  background:var(--accent);color:#fff;padding:9px 16px;border-radius:100px;font-size:12px;letter-spacing:.08em;
  display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);transition:transform .45s var(--ease)}
body.guest .guest-bar{transform:translate(-50%,0)}
.guest-bar button{color:#fff;text-decoration:underline;font-size:12px}
footer{border-top:1px solid var(--line);padding:22px 0 30px;text-align:center;font-size:11.5px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
</style>
</head>
<body>

<header class="top">
  <div class="tools-l">
    <button class="ic" id="searchBtn" aria-label="Tìm váy"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg></button>
    <button class="ic" id="guestBtn" aria-label="Chế độ khách" title="Ẩn giá khi đưa khách xem"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </div>
  <div class="top-in">
    <a href="#/" class="brand"><b class="up">MR HẠNH PHÚC</b><i></i></a>
    <div class="search" id="searchBox">
      <span class="mag"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg></span>
      <input id="q" type="search" placeholder="Tìm tên váy, chất liệu, ghi chú…" autocomplete="off">
      <button class="clr" id="qClear" aria-label="Xoá"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
  <div class="tools">
    <button class="ic" id="themeBtn" aria-label="Sáng/tối">
      <svg id="icSun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg id="icMoon" viewBox="0 0 24 24" style="display:none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button class="ic" id="favBtn" aria-label="Váy khách thích">
      <svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l8.8 8.8 8.8-8.8a5.5 5.5 0 0 0 0-7.8z"/></svg>
      <span class="badge" id="favBadge">0</span>
    </button>
  </div>
</header>

<main><div class="wrap" id="view"></div></main>

<footer><div class="wrap">MR HẠNH PHÚC · Catalogue nội bộ</div></footer>

<div class="guest-bar">Chế độ khách — đang ẩn giá <button id="guestOff">Tắt</button></div>

<!-- LIGHTBOX -->
<div id="lb" role="dialog" aria-modal="true" aria-label="Xem ảnh">
  <div class="lb-top">
    <div class="lb-info"><h4 id="lbTitle">—</h4><small id="lbCount">1 / 1</small></div>
    <div class="lb-tools">
      <button class="ic lb-play" id="lbPlay" aria-label="Trình chiếu">
        <svg viewBox="0 0 24 24"><path d="m6 4 13 8-13 8z" fill="currentColor" stroke="none"/></svg>
        <svg viewBox="0 0 24 24"><path d="M7 4h3v16H7zM14 4h3v16h-3z" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="ic" id="lbZoom" aria-label="Phóng to"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/></svg></button>
      <button class="ic" id="lbDl" aria-label="Tải ảnh"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></button>
      <button class="ic" id="lbShare" aria-label="Chia sẻ"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg></button>
      <button class="ic" id="lbClose" aria-label="Đóng"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
  </div>
  <div class="lb-stage" id="lbStage">
    <div class="lb-track" id="lbTrack"></div>
    <button class="lb-nav lb-prev" id="lbPrev" aria-label="Trước"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="lb-nav lb-next" id="lbNext" aria-label="Sau"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="lb-bot"><div class="lb-thumbs" id="lbThumbs"></div></div>
</div>

<!-- DRAWER -->
<div id="scrim"></div>
<aside id="drawer" aria-label="Váy khách thích">
  <div class="dr-top">
    <h3>Váy khách thích <span id="drCount" style="color:var(--muted)"></span></h3>
    <button class="ic" id="drClose" aria-label="Đóng"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="dr-body" id="drBody"></div>
  <div class="dr-foot">
    <button class="btn ghost" id="drClear" style="flex:0 0 auto">Xoá hết</button>
    <button class="btn" id="drCopy">Sao chép danh sách
      <svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button>
  </div>
</aside>

<div id="toast"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg><span id="toastTxt"></span></div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   ⚙️  KHU VỰC DUY NHẤT BẠN CẦN SỬA
   ══════════════════════════════════════════════════════════════════════

   CÁCH THÊM MỘT MẪU VÁY:
   1. Tạo thư mục:  anh/<maVay>/
   2. Bỏ ảnh vào, đặt tên theo số:  1.jpg  2.jpg  3.jpg ...
      (ảnh 1.jpg sẽ được dùng làm ảnh bìa)
   3. Thêm 1 dòng vào danh sách VAY bên dưới. Xong!

   Ý nghĩa các cột:
     ten     : tên hiển thị
     dm      : mã danh mục (phải trùng 1 mã trong DANH_MUC)
     thuMuc  : tên thư mục chứa ảnh trong anh/
     soAnh   : có bao nhiêu tấm (1.jpg → soAnh.jpg)
     gia     : giá thuê — để '' nếu không muốn hiện
     ghiChu  : mô tả ngắn — để '' nếu không cần
     ngay    : ngày cập nhật — để '' nếu không cần
   ══════════════════════════════════════════════════════════════════════ */

const DEMO = false;   // ← Đang dùng ảnh mẫu. Có ảnh thật rồi thì đổi thành false

const DANH_MUC = [
  {id:'all',    ten:'Tất cả'},
  {id:'vayxoe', ten:'Váy xòe'},
  {id:'vayom',  ten:'Váy ôm'},
  {id:'vaynhe', ten:'Váy nhẹ'},
  {id:'aodai',  ten:'Áo dài'},
];

const VAY = [
  {ten:'Hạnh Phúc', dm:'vayxoe', thuMuc:'hanhphuc', soAnh:6, gia:'12.000.000đ', ghiChu:'Váy signature — xòe lớn, tùng 5 lớp, đuôi 2m', ngay:'10/08/2026'},
  {ten:'Viên Mãn', dm:'vayxoe', thuMuc:'vienman', soAnh:6, gia:'9.500.000đ', ghiChu:'Xòe cổ điển, đính pha lê thủ công', ngay:'02/07/2026'},
  {ten:'Mây Trắng', dm:'vayxoe', thuMuc:'maytrang', soAnh:6, gia:'8.000.000đ', ghiChu:'Tulle bồng bềnh, trễ vai mềm', ngay:'18/06/2026'},
  {ten:'Nguyện Ước', dm:'vayom', thuMuc:'nguyenuoc', soAnh:6, gia:'7.200.000đ', ghiChu:'Dáng đuôi cá, ôm eo tôn dáng', ngay:'25/05/2026'},
  {ten:'Trăm Năm', dm:'vaynhe', thuMuc:'tramnam', soAnh:6, gia:'6.500.000đ', ghiChu:'Chữ A cơ bản, hợp mọi vóc dáng', ngay:'14/05/2026'},
  {ten:'An Nhiên', dm:'vaynhe', thuMuc:'annhien', soAnh:6, gia:'5.500.000đ', ghiChu:'Nhẹ, thoáng, dễ di chuyển cả ngày', ngay:'30/04/2026'},
  {ten:'Duyên Lành', dm:'vaynhe', thuMuc:'duyenlanh', soAnh:6, gia:'4.800.000đ', ghiChu:'Tối giản, vai vuông, thanh lịch', ngay:'12/04/2026'},
  {ten:'Bình An', dm:'vaynhe', thuMuc:'binhan', soAnh:6, gia:'4.200.000đ', ghiChu:'Dáng suông, kín đáo, đi lễ nhà thờ', ngay:'03/04/2026'},
  {ten:'Hỷ Tín', dm:'aodai', thuMuc:'hytin', soAnh:6, gia:'3.500.000đ', ghiChu:'Áo dài cô dâu, gấm thêu tay, kèm mấn', ngay:'20/03/2026'},
  {ten:'Sum Vầy', dm:'aodai', thuMuc:'sumvay', soAnh:6, gia:'2.800.000đ', ghiChu:'Áo dài bê tráp, đủ size S–XL', ngay:'20/03/2026'},
];

/* ══════════ Hết khu vực cần sửa ══════════ */

(function(){
"use strict";
const $=(s,p)=>(p||document).querySelector(s), $$=(s,p)=>[...(p||document).querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---- ảnh ---- */
const PAL=[['#E0CDBA','#F5EDE4','#A48D79'],['#D2BFB4','#F0E6DD','#8F7A6C'],['#DCC7B4','#F6F0E8','#AC9280'],
           ['#CBB9AA','#F1E9DF','#84705F'],['#E6D6C4','#F9F4ED','#B79E85'],['#C4B3A4','#EDE4D9','#8E7A6B']];
function ph(k,w,h){
  const p=PAL[Math.abs(k|0)%PAL.length];
  return 'data:image/svg+xml,'+encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs>`+
    `<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${p[0]}"/>`+
    `<stop offset=".55" stop-color="${p[1]}"/><stop offset="1" stop-color="${p[2]}"/></linearGradient>`+
    `<radialGradient id="v" cx=".48" cy=".34" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".35"/>`+
    `<stop offset="1" stop-color="#3a2f27" stop-opacity=".28"/></radialGradient></defs>`+
    `<rect width="${w}" height="${h}" fill="url(#g)"/><rect width="${w}" height="${h}" fill="url(#v)"/></svg>`);
}
addEventListener('error',e=>{
  const t=e.target;
  if(!t||t.tagName!=='IMG'||t.dataset.fb) return;
  t.dataset.fb='1'; const d=(t.dataset.ph||'0|900|1200').split('|');
  t.src=ph(+d[0],+d[1],+d[2]); t.classList.add('ready');
},true);

/* Đường dẫn ảnh: anh/<thuMuc>/<n>.jpg  — hoặc ảnh demo khi DEMO=true */
function src(v,n,w,h){
  if(!DEMO) return `./anh/${v.thuMuc}/${n}.jpg`;
  return `https://picsum.photos/seed/${v.thuMuc}${n}/${w}/${h}`;
}

/* dựng dữ liệu */
const DATA = VAY.map((v,i)=>({
  ...v, i, slug:v.thuMuc,
  anh: Array.from({length:Math.max(1,v.soAnh|0)},(_,k)=>k+1)
}));
const catName = id => (DANH_MUC.find(c=>c.id===id)||{}).ten || id;

/* ---- toast ---- */
let tT; function toast(m){ $('#toastTxt').textContent=m; $('#toast').classList.add('on');
  clearTimeout(tT); tT=setTimeout(()=>$('#toast').classList.remove('on'),2500); }

/* ---- reveal ---- */
const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);} }),
  {threshold:.05,rootMargin:'0px 0px -5% 0px'});

/* ---- ảnh blur-up ---- */
function img(el){ if(el.complete&&el.naturalWidth) el.classList.add('ready');
  else el.addEventListener('load',()=>el.classList.add('ready'),{once:true}); }

/* ══════════ YÊU THÍCH ══════════ */
const favs=new Set();
function toggleFav(slug,quiet){
  favs.has(slug)?favs.delete(slug):favs.add(slug);
  syncFav(); if(!quiet) toast(favs.has(slug)?'Đã lưu vào danh sách khách thích ♥':'Đã bỏ khỏi danh sách');
}
function syncFav(){
  const b=$('#favBadge'); b.textContent=favs.size; b.classList.toggle('on',favs.size>0);
  $('#drCount').textContent=favs.size?`(${favs.size})`:'';
  $$('.heart').forEach(h=>{const on=favs.has(h.dataset.slug);h.classList.toggle('on',on);h.setAttribute('aria-pressed',on);});
  drawFav();
}
function drawFav(){
  const body=$('#drBody');
  if(!favs.size){
    body.innerHTML=`<div class="empty"><svg viewBox="0 0 24 24" stroke-linecap="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l8.8 8.8 8.8-8.8a5.5 5.5 0 0 0 0-7.8z"/></svg>
      <div>Chưa chọn mẫu nào.<br>Bấm ♥ trên mẫu váy khách ưng để lưu lại.</div></div>`;
    return;
  }
  body.innerHTML=DATA.filter(v=>favs.has(v.slug)).map(v=>`
    <div class="dr-row" data-go="${v.slug}">
      <img src="${src(v,1,160,210)}" data-ph="${v.i}|160|210" alt="">
      <div><b>${v.ten}</b>${v.gia?`<small class="price">${v.gia}</small>`:''}
        <small class="note" style="color:var(--muted);display:block">${v.ghiChu||''}</small></div>
      <button data-rm="${v.slug}" aria-label="Bỏ"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>`).join('');
  $$('.dr-row img',body).forEach(img);
  $$('.dr-row',body).forEach(r=>r.addEventListener('click',e=>{
    const rm=e.target.closest('[data-rm]');
    if(rm){ toggleFav(rm.dataset.rm); return; }
    drawer(false); location.hash='#/vay/'+r.dataset.go;
  }));
}
function drawer(v){ $('#drawer').classList.toggle('open',v); $('#scrim').classList.toggle('open',v);
  document.body.classList.toggle('lock',v); }
$('#favBtn').addEventListener('click',()=>drawer(true));
$('#drClose').addEventListener('click',()=>drawer(false));
$('#scrim').addEventListener('click',()=>drawer(false));
$('#drClear').addEventListener('click',()=>{favs.clear();syncFav();toast('Đã xoá danh sách');});
$('#drCopy').addEventListener('click',async()=>{
  if(!favs.size) return toast('Chưa chọn mẫu nào');
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  const lines=DATA.filter(v=>favs.has(v.slug))
    .map((v,k)=>`${k+1}. ${v.ten}${v.gia?' — '+v.gia:''}${v.ghiChu?' ('+v.ghiChu+')':''}`);
  const txt=`MR HẠNH PHÚC — Váy khách thích\n${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()}\n\n`+lines.join('\n');
  try{ await navigator.clipboard.writeText(txt); toast('Đã sao chép — dán vào Zalo được rồi'); }
  catch(_){ toast('Trình duyệt chặn sao chép, bạn chụp màn hình nhé'); }
});

/* ══════════ TABS ══════════ */
let cat='all', kw='';
function drawTabs(){
  $('#tabs').innerHTML=DANH_MUC.map(c=>{
    const n = c.id==='all'?DATA.length:DATA.filter(v=>v.dm===c.id).length;
    return `<button class="tab${c.id===cat?' on':''}" data-c="${c.id}">${c.ten}${n?` (${n})`:''}</button>`;
  }).join('');
  $$('#tabs .tab').forEach(t=>t.addEventListener('click',()=>{
    cat=t.dataset.c; drawTabs(); home();
    $('#tabs .tab.on')?.scrollIntoView({inline:'center',block:'nearest',behavior:RM?'auto':'smooth'});
  }));
}

/* ══════════ MÀN HÌNH: DANH SÁCH VÁY ══════════ */
function match(v){
  if(cat!=='all' && v.dm!==cat) return false;
  if(!kw) return true;
  const s=(v.ten+' '+(v.ghiChu||'')+' '+catName(v.dm)+' '+(v.gia||'')).toLowerCase();
  return s.includes(kw);
}
function home(){
  $('#tabs').parentElement.parentElement.style.display='';
  const list=DATA.filter(match);
  const v=$('#view');
  if(!list.length){
    v.innerHTML=`<div class="empty"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
      <div>Không tìm thấy mẫu nào${kw?` cho “${kw}”`:''}.</div></div>`;
    return;
  }
  v.innerHTML=`<p class="count-line">${list.length} mẫu${cat!=='all'?' · '+catName(cat):''}${kw?' · tìm: '+kw:''}</p>
    <div class="albums">`+list.map(a=>`
      <article class="alb" data-go="${a.slug}">
        <div class="alb-img">
          <img src="${src(a,1,900,1200)}" data-ph="${a.i}|900|1200" alt="${a.ten}" loading="lazy">
          <button class="heart" data-slug="${a.slug}" aria-label="Khách thích ${a.ten}" aria-pressed="false">
            <svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l8.8 8.8 8.8-8.8a5.5 5.5 0 0 0 0-7.8z"/></svg>
          </button>
          <span class="alb-n"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m3 15 5-5 4 4 3-3 6 6"/></svg>${a.anh.length}</span>
        </div>
        <div class="alb-meta"><h3>${a.ten}</h3>
          ${a.gia?`<span class="price">${a.gia}</span>`:''}
          ${a.ghiChu?`<span class="note">${a.ghiChu}</span>`:''}
        </div>
      </article>`).join('')+`</div>`;
  $$('.alb',v).forEach((el,k)=>{
    el.style.transitionDelay=Math.min(k,10)*35+'ms'; io.observe(el);
    img($('img',el));
    el.addEventListener('click',e=>{
      if(e.target.closest('.heart')) return;
      location.hash='#/vay/'+el.dataset.go;
    });
  });
  $$('.heart',v).forEach(h=>h.addEventListener('click',()=>toggleFav(h.dataset.slug)));
  syncFav();
}

/* ══════════ MÀN HÌNH: 1 MẪU VÁY ══════════ */
let cur=null;
function album(slug){
  const a=DATA.find(x=>x.slug===slug);
  if(!a){ location.hash='#/'; return; }
  cur=a;
  $('#view').innerHTML=`
    <a class="back" href="#/"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Tất cả mẫu</a>
    <section class="cover">
      <div class="cover-side"><div class="cover-img">
        <img src="${src(a,1,900,1200)}" data-ph="${a.i}|900|1200" alt="${a.ten}"></div></div>
      <div class="cover-txt">
        <h1>${a.ten}</h1>
        <div class="cover-rule"></div>
        <div class="d">${catName(a.dm)}${a.ngay?' · '+a.ngay:''} · ${a.anh.length} ảnh</div>
        ${a.gia?`<p class="p price">${a.gia}</p>`:''}
        ${a.ghiChu?`<p class="nt note">${a.ghiChu}</p>`:''}
        <div class="cover-acts">
          <button class="btn" id="playAll">Trình chiếu
            <svg viewBox="0 0 24 24"><path d="m6 4 13 8-13 8z" fill="currentColor" stroke="none"/></svg></button>
          <button class="btn ghost" id="likeThis">
            <svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l8.8 8.8 8.8-8.8a5.5 5.5 0 0 0 0-7.8z"/></svg>
            <span id="likeTxt">Khách thích mẫu này</span></button>
        </div>
      </div>
      <div></div>
    </section>
    <section class="shots">`+a.anh.map((n,k)=>`
      <figure class="shot" data-k="${k}" style="margin:0">
        <img src="${src(a,n,900,1200)}" data-ph="${a.i+k}|900|1200" alt="${a.ten} ${n}" loading="lazy">
      </figure>`).join('')+`</section>`;
  img($('.cover-img img'));
  $$('.shot').forEach((s,k)=>{ s.style.transitionDelay=Math.min(k,9)*40+'ms'; io.observe(s); img($('img',s));
    s.addEventListener('click',()=>openLB(a,k)); });
  $('#playAll').addEventListener('click',()=>openLB(a,0,true));
  const lk=$('#likeThis');
  const sync=()=>{ const on=favs.has(a.slug); lk.classList.toggle('ghost',!on);
    $('#likeTxt').textContent=on?'Đã lưu ♥':'Khách thích mẫu này'; };
  lk.addEventListener('click',()=>{toggleFav(a.slug);sync();}); sync();
  scrollTo({top:0,behavior:'auto'});
}

/* ══════════ LIGHTBOX ══════════ */
const LB={open:false,list:[],i:0,album:null};
(function(){
  const root=$('#lb'),track=$('#lbTrack'),stage=$('#lbStage'),thumbs=$('#lbThumbs');
  let dx=0,drag=false,sx=0,sy=0,ax=null,W=innerWidth;
  let z=1,px=0,py=0,pan=false,pxs=0,pys=0;
  let play=false,raf=null,t0=0; const SDUR=4000;

  function paint(an){ track.style.transition=an&&!RM?'transform .5s cubic-bezier(.22,1,.36,1)':'none';
    track.style.transform=`translate3d(${-LB.i*W+dx}px,0,0)`; }
  function zp(){ const im=$$('.lb-item img',track)[LB.i]; if(!im) return;
    im.style.transform=`translate3d(${px}px,${py}px,0) scale(${z})`;
    im.style.cursor=z>1?'grab':'zoom-in'; }
  function rz(){ z=1;px=0;py=0; $$('.lb-item img',track).forEach(i=>i.style.transform=''); }
  function fill(){
    $('#lbTitle').textContent=LB.album.ten;
    $('#lbCount').textContent=`${LB.i+1} / ${LB.list.length}`;
    $$('img',thumbs).forEach((t,k)=>{ t.classList.toggle('on',k===LB.i);
      if(k===LB.i) t.scrollIntoView({inline:'center',block:'nearest',behavior:RM?'auto':'smooth'}); });
  }
  function go(k){ LB.i=clamp(k,0,LB.list.length-1); dx=0; rz(); paint(true); fill(); t0=performance.now(); }

  window.openLB=function(a,idx,autoplay){
    LB.album=a; LB.list=a.anh; LB.i=clamp(idx||0,0,a.anh.length-1); LB.open=true; W=innerWidth;
    track.innerHTML=a.anh.map((n,k)=>`<div class="lb-item"><img src="${src(a,n,1500,2000)}" data-ph="${a.i+k}|1500|2000" alt="" draggable="false"></div>`).join('');
    thumbs.innerHTML=a.anh.map((n,k)=>`<img src="${src(a,n,160,210)}" data-ph="${a.i+k}|160|210" alt="" data-k="${k}">`).join('');
    $$('img',thumbs).forEach(t=>t.addEventListener('click',()=>go(+t.dataset.k)));
    rz(); paint(false); fill();
    root.classList.add('open'); document.body.classList.add('lock');
    setPlay(!!autoplay);
    $('#lbClose').focus({preventScroll:true});
  };
  function close(){ LB.open=false; setPlay(false); root.classList.remove('open');
    if(!$('#drawer').classList.contains('open')) document.body.classList.remove('lock'); }

  stage.addEventListener('pointerdown',e=>{
    if(e.target.closest('button')) return;
    stage.setPointerCapture(e.pointerId);
    if(z>1){ pan=true; pxs=e.clientX-px; pys=e.clientY-py; return; }
    drag=true; ax=null; sx=e.clientX; sy=e.clientY; setPlay(false);
  });
  stage.addEventListener('pointermove',e=>{
    if(pan){ px=e.clientX-pxs; py=e.clientY-pys; zp(); return; }
    if(!drag) return;
    const mx=e.clientX-sx,my=e.clientY-sy;
    if(ax===null){ if(Math.abs(mx)<6&&Math.abs(my)<6) return; ax=Math.abs(mx)>Math.abs(my)?'x':'y'; }
    if(ax!=='x') return;
    dx=mx*((LB.i===0&&mx>0)||(LB.i===LB.list.length-1&&mx<0)?.3:1); paint(false);
  });
  function up(){ if(pan){pan=false;return;} if(!drag) return; drag=false;
    const th=Math.min(W*.14,110);
    if(dx<-th) LB.i=Math.min(LB.i+1,LB.list.length-1); else if(dx>th) LB.i=Math.max(LB.i-1,0);
    dx=0; paint(true); fill(); }
  stage.addEventListener('pointerup',up); stage.addEventListener('pointercancel',up);
  stage.addEventListener('dblclick',e=>{ if(e.target.tagName==='IMG'){ z=z>1?1:2.3; px=py=0; zp(); }});
  stage.addEventListener('wheel',e=>{ if(!LB.open) return; e.preventDefault();
    z=clamp(z+(e.deltaY<0?.25:-.25),1,4); if(z===1){px=py=0;} zp(); },{passive:false});

  $('#lbClose').addEventListener('click',close);
  $('#lbPrev').addEventListener('click',()=>go(LB.i-1));
  $('#lbNext').addEventListener('click',()=>go(LB.i+1));
  $('#lbZoom').addEventListener('click',()=>{ z=z>1?1:2.3; px=py=0; zp(); });
  $('#lbDl').addEventListener('click',async()=>{
    const u=$$('.lb-item img',track)[LB.i].src;
    try{ const r=await fetch(u,{mode:'cors'}); if(!r.ok) throw 0;
      const b=await r.blob(),o=URL.createObjectURL(b),a=document.createElement('a');
      a.href=o; a.download=`${LB.album.thuMuc}-${LB.i+1}.jpg`; a.click();
      setTimeout(()=>URL.revokeObjectURL(o),4000); toast('Đang tải ảnh…');
    }catch(_){ window.open(u,'_blank','noopener'); toast('Đã mở ảnh ở tab mới'); }
  });
  $('#lbShare').addEventListener('click',async()=>{
    const url=location.href.split('#')[0]+'#/vay/'+LB.album.slug;
    try{ if(navigator.share) await navigator.share({title:LB.album.ten,url});
      else { await navigator.clipboard.writeText(url); toast('Đã sao chép liên kết'); } }
    catch(_){ toast('Liên kết: '+url); }
  });
  function setPlay(v){ play=v; $('#lbPlay').classList.toggle('on',v);
    if(v){ t0=performance.now(); tick(); } else { cancelAnimationFrame(raf); $('#lbPlay').style.setProperty('--p','0deg'); } }
  function tick(){ if(!play) return; const e=performance.now()-t0;
    $('#lbPlay').style.setProperty('--p',(Math.min(e/SDUR,1)*360)+'deg');
    if(e>=SDUR){ LB.i=LB.i>=LB.list.length-1?0:LB.i+1; dx=0; rz(); paint(true); fill(); t0=performance.now(); }
    raf=requestAnimationFrame(tick); }
  $('#lbPlay').addEventListener('click',()=>setPlay(!play));

  addEventListener('keydown',e=>{
    if(!LB.open) return;
    if(e.key==='Escape')close();
    else if(e.key==='ArrowRight')go(LB.i+1);
    else if(e.key==='ArrowLeft')go(LB.i-1);
    else if(e.key===' '){e.preventDefault();setPlay(!play);}
  });
  addEventListener('resize',()=>{W=innerWidth; if(LB.open)paint(false);});
})();

/* ══════════ TÌM KIẾM ══════════ */
$('#searchBtn').addEventListener('click',()=>{
  const b=$('#searchBox'); b.classList.toggle('open');
  if(b.classList.contains('open')) $('#q').focus(); else { kw=''; $('#q').value=''; render(); }
});
let qT; $('#q').addEventListener('input',e=>{
  clearTimeout(qT); qT=setTimeout(()=>{ kw=e.target.value.trim().toLowerCase();
    if(location.hash.startsWith('#/vay/')) location.hash='#/'; else home(); },220);
});
$('#qClear').addEventListener('click',()=>{ $('#q').value=''; kw=''; $('#q').focus(); home(); });

/* ══════════ CHẾ ĐỘ KHÁCH ══════════ */
function guest(v){ document.body.classList.toggle('guest',v); $('#guestBtn').classList.toggle('on',v);
  toast(v?'Chế độ khách — đã ẩn giá':'Đã hiện lại giá'); }
$('#guestBtn').addEventListener('click',()=>guest(!document.body.classList.contains('guest')));
$('#guestOff').addEventListener('click',()=>guest(false));

/* ══════════ THEME ══════════ */
$('#themeBtn').addEventListener('click',()=>{
  const d=document.documentElement.dataset.theme==='dark';
  document.documentElement.dataset.theme=d?'light':'dark';
  $('#icSun').style.display=d?'':'none'; $('#icMoon').style.display=d?'none':'';
});

/* ══════════ ROUTER ══════════ */
function render(){
  const h=location.hash;
  const m=/^#\/vay\/(.+)$/.exec(h);
  if(m) album(decodeURIComponent(m[1])); else home();
}
addEventListener('hashchange',render);
drawTabs(); render(); syncFav();

/* ══════════ PWA ══════════ */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
addEventListener('beforeinstallprompt',e=>{
  e.preventDefault(); const dp=e;
  const b=document.createElement('button'); b.className='btn';
  b.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:650';
  b.innerHTML='Cài app vào máy <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>';
  b.onclick=async()=>{ b.remove(); dp.prompt(); await dp.userChoice; };
  document.body.appendChild(b); setTimeout(()=>b.remove(),15000);
});
})();
</script>
</body>
</html>
